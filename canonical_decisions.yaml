DEC-google-style-allman:
  status: decided
  question: Which style governs first-party LawSpec, Learn and MCP code and generated output?
  answer: |
    Owner direction requires Google's current language style guide before language-specific defaults, with the owner's subsequent explicit Allman-brace preference taking precedence where the established formatter supports it. In a subsequent clarification, keep the standard layout when the formatter cannot support Allman rather than adding a custom formatter; Go retains its grammatical brace placement. Apply this to compiler/runtime output, repository scripts, scaffolds, lesson projects and browser code, MCP and project tooling, and their authoritative templates. Use existing language formatters and parsers, with pinned settings and checks; style compliance includes naming, imports and implementation choices, not just whitespace. Keep generation deterministic and native/WASM compiler output identical. Compiler target printing stays pure; repository build tools and on-device lesson formatting may use pinned formatters. Preserve source-defined public identities, ABI and behavior, mandatory definition validation and evidence states. Do not rewrite third-party code or unlabelled machine bundles as if they were authored examples; explicitly requested compact output remains an explicit separate mode. Review the new Google Rust guide including its generated-code and ontology exceptions, imports, expect/pattern matching and narrow panic-boundary exception rather than equating rustfmt with conformance. LawSpec's own formatter remains the source-style authority where there is no external language guide. This supersedes the default-configuration clauses of DEC-readable-output-default and DEC-web-prettier-printer while preserving their history, pure compiler printing and formatter-fixed-point checks. The owner identified prettier-plugin-brace-style; pin 0.10.4 with Prettier 3.9.10 and braceStyle allman, using Google's gts settings, for the shared Node/browser web profile. The current Rust typed-failure panic ABI is a recorded incompatibility with Google's no-panic-control-flow rule; do not claim full Rust-guide compliance or silently change its semantics as a style edit. Java authoring uses Eclipse JDT 3.47.0 with the archived Google profile and explicit Allman/current-record settings; acceptance still checks the current Google/owner Checkstyle rules. Do not use clang-format as a substitute for the Java profile.
