DEC-prolog-janus:
  status: decided
  question: How should the Prolog backend reuse established execution and proof infrastructure without conflating Prolog failure with a typed result?
  answer: |
    Use SWI-Prolog and its Janus interface over the existing checked Python model/runtime, following the established host-backed Clojure, Groovy and C# targets. Start from the selected Python 3.13+ interpreter with janus-swi 1.5.3; the installed SWI executable may embed a different Python. Runtime transport, Core-derived handler and PLUnit generation, public target dispatch and CLI integration are implemented. Full shared native acceptance remains incomplete. Metadata comes from checked Core and supported schema interfaces, never generated-source scraping. The schema exposes is_handle so a handle represented by a Python collection or scalar retains opaque identity. Prolog adapters take inputs followed by one result. SWI's standard determinism guard rejects logical failure and choicepoints, and ground acyclic results are required. A returned false, typed native failure, explicitly incomplete computation and unexpected exception remain distinct. Constructor identities, nested presence, raw text units, exact Decimal/Rational values and IEEE bits are explicit terms; Janus owns foreign references and thread attachment. Foreign calls do not run under a new global bridge lock. Applications must respect the documented GIL/mutex ordering when mixing their own Prolog locks with Python callbacks.

    SPARK treats a non-SPARK implementation as an assumption behind its contract: Prolog adapters and foreign libraries remain an execution trust boundary. Why3 distinguishes execution/extraction drivers from verification: this bridge is code generation and execution infrastructure, not a new compiler verification backend. Lean's extern/export interface has runtime ABI and ownership requirements: Janus supplies those mechanisms rather than a custom FFI. Idris places effects in PrimIO and relies on the caller's foreign purity declarations: LawSpec ability evidence and typed failures must remain explicit. Rocq extraction can realize external constants without checking their implementations in the kernel: generated-model agreement or a successful foreign call is not proof of external code. No obligation generator, solver executor or proof checker is added by this decision; existing mandatory definition validation and optional verification layers remain separate. Selected host Hypothesis cases execute in one pytest session, retaining the established host scheduler and resource scopes. PLUnit consumes actual per-slot results with strict collection and duplicate checks. Context variables scope structured incomplete events in parallel workers; an unscoped event conservatively invalidates active cases or the selected batch when no case can be identified. Standard JUnit properties retain those identities and outcomes. Generated assertions already include explicit diagnostics, so pytest uses plain assertions and standard Python tracebacks to avoid whole-module AST rewriting and failure-source processing on large emitted modules. Optimized Python is rejected before execution so disabled assertions cannot become successful evidence. Core test manifests supply exact model/scenario/supervision slots. Generated predicates have an ls_ prefix to avoid protected system predicates. Checked-model calls expose explicit reusable symbol contexts, and handler arguments retain resolved ability identities. Async adapters reuse the existing host Async task runner with copied context variables and a shielded wrapped future. Cancelling a waiting task neither terminates the predicate nor joins it at event-loop shutdown; late native exceptions are consumed without erasing their structured status. Janus query_once attaches worker-thread engines for callbacks; apply_once does not supply that documented attachment path. Prolog is registered in the public program inventory. Materialized definition admission reuses the existing checked witness erasure and mandatory logical definition checker, including when no explicit contracts exist; forged trailing witnesses are rejected. Native incomplete-result evidence uses structured logging events and standard pytest/JUnit properties, including model worker threads; no status is inferred from exception descriptions. Native functions and production handlers bind by qualified module/predicate identities. Resolved constructor metadata maps records to qualified tagged dicts, variants to qualified compound terms and units to atoms; Core layout trees preserve native argument positions and nested record structure. Qualified ground handle tokens are retained by Janus and weakly interned using term hashing plus exact identity comparisons; cache synchronization never covers application execution. Native constructor and handle identities must be distinct across the project. Constructors omit Unit inputs, methods receive their bound native handle first, and qualified native exceptions construct their resolved typed message/product payloads before existing schema validation. Custom codec hooks remain an explicit unsupported fragment. Application and generator modules use load_files/2 with imports([]), so equal predicate names in separate units never import into the process-global user module. Generator factories construct ordinary Hypothesis strategies through Janus, retaining child strategies and the existing schema validation of every sample and shrink. The full shared target acceptance matrix remains required before declaring target completion.
  opened: 0.26.0
  decided: 0.26.0
  refs: [REQ-prolog-target, pytest-collection-hooks, pytest-plain-assertions, pytest-standard-tracebacks, python-contextvars, swi-qualified-module-loading, swi-janus-calls, swi-janus-terms, swi-native-dicts, swi-native-compounds, hypothesis-custom-strategies, swi-janus-data, swi-janus-python, swi-janus-threads, swi-determinism, python-asyncio-shield, python-asyncio-wrap-future, python-future-cancellation, spark-subprogram-contracts, why3-execution, lean-ffi, idris-ffi, rocq-extraction]

DEC-artifact-targets:
  status: decided
  question: How do configuration, grammar and pipeline targets share the compiler without claiming application law execution?
  answer: |
    HCL, YAML, ANTLR and Make consume checked Core through a separate artifact emitter. Every entry point validates definitions independently of optional law layers. The existing total-definition evaluator computes configuration constants; JSON Schema 2020-12 and Terraform/OpenTofu variable validation carry the supported data constraints. Unsupported constraints are explicit target-unsupported diagnostics. A missing configuration input is incomplete, not a generated complete YAML document. ANTLR owns parser generation and its output is syntax only. Roots include concrete declaration inputs and results. Each root has an EOF-consuming parser entry and a matching schema reference selected by the expected concrete Core type; overlapping generic constructor syntax cannot choose that type. The companion schema validates decoded values using the selected reference. Closed indexed inputs remain explicit unsupported diagnostics. Make uses ordinary phony prerequisites to orchestrate the installed CLI. Artifact targets emit no native test or benchmark slots, and their manifests state lawsExecuted=false. Native program suites and artifact validators use separate target inventories. Canon checks the same emitted bytes and its inventory is compared with LawSpec's public export. No new solver or proof checker is introduced; Prolog has a separate executable backend whose full shared acceptance remains open.
  opened: 0.26.0
  decided: 0.26.0
  refs: [REQ-artifact-targets, lawspec-roadmap, json-schema-2020-12-validation, json-schema-structuring, opentofu-input-variables, antlr4-parser-rules, gnu-make-phony-targets]

DEC-canonical-format:
  status: decided
  question: LawSpec repeats facts across the CHANGELOG, the explanation pages, local plan files, docs/nav.json and the npm package, and its comments were never judged. How does each fact get one home that cannot drift?
  answer: |
    LawSpec adopts canon's canonical format in 0.20.1. canon.yaml, canonical_refs.yaml, canonical_decisions.yaml and canonical_exemptions.yaml sit at the root; every work cited in the docs and code is a registry entry, every decision a ledger entry cited as ref:KEY, every page a Folio page with front matter, and CHANGELOG.md follows Keep a Changelog. canon ingest records every comment, page, decision and reference as pending. The owner defers vetting until 1.0: rough 1.0 feature parity comes first, then the rewrite, the clean-up and the sign-off. The comments, tests and pages still owed remain exempt until then, so releases can carry the debt without signing it off. The debt is revisited in 1.0.0. Decided by the owner for 0.20.1.
  opened: 0.20.1
  decided: 0.20.1
  refs: [canon, keep-a-changelog, diataxis]

DEC-canon-from-a-checkout:
  status: decided
  question: canon interprets grammars that live in its own repository. Where does LawSpec get them, and the binary that reads them?
  answer: |
    From one canon checkout, named by CANON_HOME and built with stack build. lawspec-dev canon links .canon to it, so the profiles in canon.yaml name .canon/grammars/..., and runs that checkout's binary (or CANON). Nothing of canon is copied into LawSpec, so the grammars and the binary that interprets them cannot disagree. Without a checkout the step prints how to install canon and is skipped, so the rest of the complete check still runs.
  opened: 0.20.1
  decided: 0.20.1
  refs: [canon]

DEC-vet-with-rices-tax:
  status: decided
  question: canon records 3,243 comments, pages, decisions and references as pending, and the owner signs each at 1.0. Editing canonical_vetting/ by hand means reading each comment beside its code in another window and typing its key. How does the owner vet them, and how do the tool and the check agree on what is pending?
  answer: |
    On Rice's Tax's review page (ref rices-tax): make assess records every pending row, make tax serves the page, which shows each row with the code or page it explains, what it cites, and canon's finding on it, and writes a verdict into the vetting file in the working tree; the owner reviews git diff and commits, so blame names the signer; make audit and make canon report what is left. Rice's Tax reads the repository through canon's library, so the two must be one canon version: canon.yaml names it under canon (0.2.1, any 0.2 patch being compatible), Rice's Tax refuses any other, and lawspec-dev tax refuses a CANON_HOME of another version than Rice's Tax's. RICESTAX_HOME names the Rice's Tax checkout as CANON_HOME names canon's. The directory exemptions of 0.20.1 stay until the owner lifts them, one subject at a time from the page or whole; rows under them can be decided before. Rice's Tax's What queue, a verdict on each name and signature, is raised by assess and exempted for the kind name until 1.0.0, with the rest of the vetting deferred to 1.0.
  opened: 0.20.1
  decided: 0.20.1
  refs: [rices-tax, canon]

DEC-canon-dialect-profiles:
  status: decided
  question: canon's samples check Python, JavaScript, TypeScript, Go and Kotlin through plain grammars with units, which take every line comment as documentation. Which profiles does LawSpec use for its runtimes?
  answer: |
    The canonically commented dialects canon ships for those five languages, named in the profile with no units, as canon's README allows. They read each language's own documentation form, a docstring, JSDoc or TSDoc, a Go doc comment or KDoc, so an ordinary comment is neither a Why nor an orphan; the plain profiles reported 233 orphans that were ordinary comments. Java and Haskell use their dialects, as the samples do, and Rust the sample's profile, which already tells /// from //.
  opened: 0.20.1
  decided: 0.20.1
  refs: [canon]

DEC-generated-files-not-checked:
  status: decided
  question: Which files does canon read, when much of the repository is generated from templates and runtimes?
  answer: |
    The sources a person edits. canon.yaml ignores what lawspec-dev generate writes (npm/, tools/*.mjs, editors/vscode/test/grammar.test.mjs, editors/vscode/test/extension.test.mjs, src/LawSpec/RuntimeSources.hs) and the local output directories, so a Why is written once, in the template or runtime it is generated from, and every output carries the header naming that template, as DEC-generated-javascript has it.
  opened: 0.20.1
  decided: 0.20.1

DEC-template-holes:
  status: open
  question: templates/site/playground.mjs and templates/tools/package-smoke.mjs put a value hole where JavaScript needs an expression, so canon cannot parse them. How do templates stay parseable?
  answer: |
    Until decided, canon.yaml ignores those two templates. Candidates are a hole form that is itself an expression, or moving the value into a statement the grammar reads.
  opened: 0.20.1
  revisit: 1.0.0

DEC-docs-landing-page:
  status: decided
  question: canon requires every page to name a Diátaxis quadrant that matches its directory. Where does the site's landing page, docs/index.md, belong?
  answer: |
    Nowhere: it is the entrance to the four quadrants, not a page of one, as Diátaxis describes the landing page. Its front matter names kind index, lawspec-dev docs accepts that kind for docs/index.md alone, and canon.yaml ignores the page.
  opened: 0.20.1
  decided: 0.20.1
  refs: [diataxis]

DEC-page-titles-in-front-matter:
  status: decided
  question: A page's title was written in docs/nav.json and again as the page's heading. Which is its home?
  answer: |
    The page's front matter, beside its id and kind, in the Folio form canon reads. docs/nav.json keeps only the order, the lesson tracks and the titles of sections that have no page; lawspec-dev docs reads every page's title from its front matter and rejects a page entry that names one.
  opened: 0.20.1
  decided: 0.20.1
  refs: [canon]

DEC-include-fences:
  status: decided
  question: lawspec-dev docs used file= on a fenced block to include a file into the page, while canon's file= tangles a block out into a file. How do both live in docs/?
  answer: |
    LawSpec's include is spelled include=, for lawspec playgrounds and for code from other files, with region= as before. file= is left to canon; lawspec-dev docs shows such a block as it is.
  opened: 0.20.1
  decided: 0.20.1
  refs: [canon]

DEC-npm-documents-copied:
  status: decided
  question: npm/README.md and npm/CHANGELOG.md were committed copies of the root files, staged by tools/wasm.sh. How does the package get them without a second copy in git?
  answer: |
    The package's prepack script copies them from the root whenever it is packed or published, and git ignores the copies. dev/Generate.hs lists them once, in copiedDocuments, which feeds both the package's files and the script. lawspec-dev integrity still requires a present copy to match its source.
  opened: 0.20.1
  decided: 0.20.1

DEC-rationale-in-ledger:
  status: decided
  question: Why a design is as it is was told in the CHANGELOG, in explanation pages and in local plan files, each a little differently. Where does the reason live?
  answer: |
    In this ledger, one entry per decision, cited from comments and pages as ref:KEY. The CHANGELOG says what changed and what users must do; an explanation page explains and cites the decision; the local plan files are kept in to_be_removed/ until every decision in them is folded in here, then deleted.
  opened: 0.20.1
  decided: 0.20.1
  refs: [keep-a-changelog]

DEC-tests-cite-requirements:
  status: decided
  question: canon recognises a Haskell test as a function named test_* or prop_*, and a test must cite the requirement it verifies. How does the Hspec suite take part?
  answer: |
    Each test module's top-level spec is a function named test_ for the property it verifies, with a Haddock comment giving why the property must hold and citing a requirement entry of the registry; test/Main.hs runs them. The it names inside say the property each example checks.
  opened: 0.20.1
  decided: 0.20.1
  refs: [hspec]

DEC-canon-haskell-comprehension-case:
  status: superseded
  by: DEC-canon-reads-original-haskell
  question: canon's Haskell grammar cannot parse a case expression inside a list comprehension ([case a of ...; o -> o | a <- as]), which the LawTwin work uses in Core and the typed emitters. How does canon check stay green without reshaping valid code?
  answer: |
    The code stays as written. canon.yaml ignores exactly the modules canon fails to parse (src/LawSpec/Core.hs, src/LawSpec/Core/Total.hs and src/LawSpec/Typed/Go.hs, Haskell.hs, Jvm.hs, Python.hs and Web.hs), as a temporary entry for a canon bug. Their vetting rows, all pending, leave canonical_vetting with them, since canon reports a verdict on material it no longer reads; nothing signed is lost. When canon's Haskell grammar parses a case in a comprehension, the entry is removed, canon ingest records the modules' rows as pending again, and they are checked again.
  opened: 0.22.0
  decided: 0.22.0
  refs: [canon]

DEC-canon-reads-original-haskell:
  status: decided
  question: canon 0.2.1's Haskell grammar parses a case inside a list comprehension, a let in a guard followed by a comma, a do block as a case's scrutinee, a guard after a do block and a let with explicit braces (canon's DEC-layout-bars-commas-and-of). What becomes of the reshaped code and the temporary ignore entries?
  answer: |
    The code is written as Haskell allows, never reshaped for a checker. The modules reshaped in 0.20.1 (DEC-haskell-grammar-workarounds) have their original forms back, the modules canon.yaml ignored for the LawTwin work (DEC-canon-haskell-comprehension-case) are checked again with their vetting rows, and canon.yaml names canon 0.2.1.
  opened: 0.22.0
  decided: 0.22.0
  refs: [canon]

DEC-haskell-grammar-workarounds:
  status: superseded
  by: DEC-canon-reads-original-haskell
  question: canon's Haskell grammar could not read nine of LawSpec's modules, where a case sits in a list comprehension, a let in a guard is followed by a comma, a do block is a case scrutinee, a guard follows a do block, or a let uses explicit braces. What changes?
  answer: |
    The code, without changing its meaning: such a case is parenthesised, the guard binds with a pattern guard, the do block is named in a let, the guards are reordered, and the lets use layout. canon is not changed; the grammar's gaps are canon's to close, after which the parentheses may go.
  opened: 0.20.1
  decided: 0.20.1
  refs: [canon]

DEC-test-names-audit:
  status: open
  question: Does every Hspec it name, and every acceptance and native test name, state the property it verifies rather than the thing it exercises?
  answer: |
    Not yet audited. canon cannot see an it name, since an Hspec example is a call rather than a declaration; the owner reviews them with the vetting at 1.0; the audit is revisited in 1.0.0.
  opened: 0.20.1
  revisit: 1.0.0
  refs: [hspec]

DEC-typed-core-boundary:
  status: decided
  question: Where does the meaning of a specification live, so that eight backends agree on it?
  answer: |
    In one shared front end and a typed Core. Parsing, import resolution, elaboration, name resolution and inference produce typed Core with resolved ids, explicit arithmetic evidence and conversions, and a proposition tree; an independent Core validator re-checks it. The eight emitters consume only Core and the testing plan and never import source syntax or inference, which lawspec-dev boundaries enforces. A feature added in the front end therefore works on every target without backend changes. Shipped in 0.8.0; recorded in CHANGELOG 0.8.0 and docs/explanation/how-the-compiler-works.md.
  opened: 0.8.0
  decided: 0.8.0

DEC-typed-native-definitions:
  status: open
  question: Generated checked definitions evaluated the dynamic value every target shares, so a stateful spec handler copied its whole state on every operation and searched a KeyVal as a list. How do the generated definitions and handlers become fast enough to serve as a runtime (LawTwin's twins) without changing what they mean?
  answer: |
    On every target (Rust, Go, Java, Kotlin, Python, JavaScript, TypeScript, Haskell, F#, C#, Erlang, Elixir and Gleam), a checked definition runs as typed native code when every value it touches has a typed form (Bool, Unit, the bounded integers, Integer, Text, Bytes, List, Maybe, Either, KeyVal, Set and data built from them), it calls only typed definitions and has no runtime contract or policy; anything else stays on the dynamic path. raise and attempt fail and catch exactly as the dynamic code does (a Rust panic, a Go panic, the JVM's, Python's, JavaScript's and Haskell's failure exception carrying the failure's dynamic value), so typed and dynamic code fail into each other. Typed code carries the handler context: a definition that performs another ability's operation takes the law's symbols and calls the operation's handler there with native values, as the dynamic code does, so client handlers (LawTwin's kafkaProducer, kafkaConsumer, kafkaTransactions) run typed too. The sequence helpers (++, slice, at, range, octets, bytesOf, utf8, textOf, join) are typed on every target, and a typed spec handler answers every ability it is declared for, from a computed start. LawSpec.Typed.Plan decides it once for the seven emitters. Lists are persistent cons lists that share their tails, KeyVal and Set persistent ordered trees in the portable order (AVL trees; Data.Map and Data.Set in Haskell), Integer a machine word (a safe JavaScript number) until it outgrows it, and data shared by reference (a tuple in Python, a strict data type whose derived order is the portable one in Haskell), so a handler's state is never copied and an operation costs what it changes. Typed Haskell runs in IO, strictly, so an operation happens once and in order. Self tail calls become loops. The collections unit's KeyVal and Set operations are intrinsics. Definitions that are the same up to their names (an import's copies) share one body, named from its declaration so that unrelated edits do not rename it. Values cross to dynamic code through converters at the boundary, and to native code (the handler's interface) directly, or through the handler schema where lawspec.json binds native types. An embedded handler also gives each failing operation a form returning its failure as a value, and reads and replaces its state. On the BEAM (0.24), typed code is one Erlang module, lawspec_typed, shared by Erlang, Elixir and Gleam over each language's own data (tuples, structs, custom types), so only KeyVal and Set convert at its boundary: typed code keeps them as maps and version 2 sets, giving entries and items in the portable order through Erlang's term order where it is the same and a generated comparison where it is not. A typed handler's state stays in its cell's process, where each operation runs (an operation that performs joins the handlers' dependency graph), so only arguments and results are copied; its typed snapshot is a copy, since processes share no heap. Generation depends only on the program: the compiler's on-disk cache is kept per compiler build. The acceptance suites, with their mutants, check both paths on every target. Proposed for the owner's sign-off.
  opened: 0.21.0
  revisit: 1.0.0

DEC-elaborate-before-core:
  status: decided
  question: How are new surface features (indexed families, wrappers, workflows, imports, flow types, collections) added without changing Core or the backends?
  answer: |
    Each is elaborated in the front end into constructs Core already has: indexed families into erased data, structural measures and refinements; wrappers into refined products; workflows into steps and a generated law; imports into copied declarations under unit-derived names; flow functions into products indexed by the output state; collections into an ordinary LawSpec unit with checked definitions. Core and the eight backends stay unchanged, and the boundary check keeps them so. Recorded in to_be_removed/PLAN-0.11.md, PLAN-0.13.md, PLAN-0.14.md, PLAN-0.16.md and PLAN-0.17.md.
  opened: 0.11.0
  decided: 0.17.0

DEC-portable-exact-arithmetic:
  status: decided
  question: Whose arithmetic does a law use when Java wraps, Python does not, JavaScript uses doubles and Go's int depends on the machine?
  answer: |
    LawSpec's own. Integer arithmetic is exact and never wraps, exact division yields a Rational, Decimal ignores ambient rounding contexts, and floating point follows IEEE 754 at its declared precision. Moving an exact value into a bounded type is always a checked conversion, and every adapter result is validated against its declared domain. Equality is defined once: NaN differs from itself, signed zeros are equal, Symbols compare by identity, and data compares field by field, implemented directly rather than through each language's equals. Recorded in docs/explanation/portable-semantics-and-machine-profiles.md and CHANGELOG 0.8.0 and 0.9.0.
  opened: 0.8.0
  decided: 0.9.0
  refs: [ieee-754, decimal-arithmetic]

DEC-abstract-integer-at-boundaries:
  status: decided
  question: What native type does an adapter returning the abstract Integer use?
  answer: |
    Any integral native value: Integer is the top of each target's integral tower, so a Kotlin adapter may return Int, Long or BigInteger and a Haskell adapter any Integral through integerValue. The result bridge rejects non-integral values and discharges the logical domain; arguments remain concrete. 0.9 had narrowed Kotlin and Haskell results to BigInteger and Integer, which broke the Kotlin and Haskell CI jobs; 0.11 restored the tower-polymorphic Number and LS.IntegerValue. Keeping abstract types polymorphic leaves the storage decision with the implementation. Recorded in to_be_removed/PLAN-0.11.md section 1.
  opened: 0.11.0
  decided: 0.11.0

DEC-explicit-machine-profile:
  status: decided
  question: How are machine-sized integers (IntSize, UIntSize, UIntPtr) given a meaning when their range depends on the platform?
  answer: |
    The machine profile is a property of the specification, machineBits 32 or 64, default 64, and sets the range for literals, examples, generators, boundaries and bridges. Targets that bind machine-sized types to native machine integers (Go, Haskell, Rust) check at runtime that the executing architecture matches and report a mismatch rather than test a different range. Every acceptance suite runs in both profiles. Recorded in docs/explanation/portable-semantics-and-machine-profiles.md and CHANGELOG 0.8.0.
  opened: 0.8.0
  decided: 0.8.0

DEC-native-property-frameworks:
  status: decided
  question: Which test machinery runs a law on each target?
  answer: |
    Each target's own property-testing framework: JetCheck for Java, Hypothesis for Python, fast-check for JavaScript and TypeScript, Rapid for Go, Hedgehog for Haskell, Kotest for Kotlin and Proptest for Rust. The specification, the adapters that implement it and the machinery that tries to refute it stay separate, so two implementations in two languages are checked against the same laws inside the projects and test frameworks teams already use. Recorded in docs/explanation/why-executable-laws.md.
  opened: 0.8.0
  decided: 0.8.0
  refs: [quickcheck, hypothesis, fast-check, rapid-go, hedgehog, kotest, proptest]

DEC-examples-pin-laws:
  status: decided
  question: Why do laws carry hand-written examples as well as generated cases?
  answer: |
    A law says what holds for every input but not what the answer is for a particular input, and two implementations can agree and both be wrong. Examples with expected results, written by the author and never inferred from code, fix the known answers; boundaries and examples always run, and custom generators or narrow refinements cannot remove them. Recorded in docs/explanation/why-executable-laws.md and generation-and-shrinking.md.
  opened: 0.9.0
  decided: 0.9.0

DEC-never-pass-vacuously:
  status: decided
  question: What happens when a property cannot check any input?
  answer: |
    It fails. An empty or unreachable domain fails, a generator that finds no valid input within maxAttempts fails with reproduction information (exhausting a search never claims the domain empty), a statically empty domain and an example outside its domain are compile errors, and a predicate that raises is a failure, not a rejected sample. A property that checked nothing has proved nothing, and hiding errors as rejections could turn a crash into a skipped case. Recorded in docs/explanation/generation-and-shrinking.md and CHANGELOG 0.10.0.
  opened: 0.9.0
  decided: 0.10.0

DEC-planned-generation:
  status: decided
  question: How are inputs for refined and dependent domains generated without filtering most samples away?
  answer: |
    Inputs are planned once from typed Core and every backend follows the plan with its own framework. Constant bounds of a refinement narrow the drawn range; linear comparisons give bounds for dependent inputs, which are seeded from the predicates, backtrack when an earlier choice leaves no continuation, and fall back to bounded sampling with the full predicate always checked. Constraints on linear structural measures, such as a vector's index, are solved backwards from constructor equations instead of sampled, because filtering for a fixed index does not terminate in practice (Vec 2 Int8 hung under Hypothesis in the 0.11 prototype). Recorded in to_be_removed/PLAN-0.11.md and docs/explanation/generation-and-shrinking.md.
  opened: 0.9.0
  decided: 0.19.0

DEC-shrink-within-domain:
  status: decided
  question: How does shrinking stay consistent with refinements and indices?
  answer: |
    LawSpec keeps each framework's own shrinker and makes every candidate valid: refinements are re-checked on every candidate, later dependent inputs are repaired when an earlier one shrinks, recursive values shrink within their structural budget, and indexed values shrink within their index because the index is a generator parameter, not a filter. Shrinking to an input outside the domain would report a failure the law does not claim. Recorded in to_be_removed/PLAN-0.11.md and docs/explanation/generation-and-shrinking.md.
  opened: 0.9.0
  decided: 0.11.0

DEC-structural-size-budget:
  status: decided
  question: How does recursive generation terminate while keeping every shape reachable?
  answer: |
    Recursive data has a structural budget counting each scalar, container and constructor. Each constructor reserves the minimum its fields need before the remainder is shared out, and list lengths and element budgets vary together, so generation always terminates, deep singletons remain possible and there is no hidden length cap. Recorded in to_be_removed/PLAN-0.9.md and docs/explanation/generation-and-shrinking.md.
  opened: 0.9.0
  decided: 0.9.0

DEC-portable-seeded-generation:
  status: decided
  question: How do stateful-model runs, shrinks and workflow randomness reproduce identically on every target?
  answer: |
    A SplitMix64 generator over type descriptors, implemented in every runtime, gives the same runs and the same shrinks for the same seed; workflow runtimes use the same SplitMix64 source. One seed per run is printed and recorded, LAWSPEC_SEED and --seed fix it. Recorded in CHANGELOG 0.17.4, 0.18.0 and 0.19.0.
  opened: 0.17.4
  decided: 0.19.0
  refs: [splitmix]

DEC-total-definitions:
  status: decided
  question: Which definitions may a specification state and the compiler trust?
  answer: |
    Checked definitions must be total: matches are exhaustive, recursion is structural and established as terminating, and every operation that could fail is guarded; partial matches and recursion the checker cannot establish are rejected. Generic definitions specialize to their concrete uses. Backends emit them from checked Core rather than interpreting source. Recorded in to_be_removed/PLAN-0.9.md and CHANGELOG 0.9.0.
  opened: 0.9.0
  decided: 0.9.0

DEC-algebraic-maybe-either:
  status: decided
  question: How do Maybe and Either relate to the interoperability states Nullable and Optional?
  answer: |
    Maybe (Absent/Present) and Either (Left/Right) are algebraic data, distinct from Nullable and Optional, which model native absence and keep nested absence states apart. Recorded in to_be_removed/PLAN-0.9.md.
  opened: 0.9.0
  decided: 0.9.0

DEC-maybe-present-absent:
  status: decided
  question: What are Maybe's constructors called?
  answer: |
    Present x and Absent; the type stays Maybe a. The owner decided this on 2026-10-21 because the words read clearly to non-mathematicians. It is a hard rename: Just and Nothing are not aliases, and a source that uses them is refused with an error naming the new constructor. The pre-1.0 contract gives no migration support, and no formatter rewrite exists: formatting preserves constructor spelling, including when parsing alone. Generated code uses the new names wherever LawSpec's constructor names appear (data tags, runtime classes and helpers, typed native names, BEAM atoms, rendered values, editor grammars, npm names). Native mappings stay as they were: Rust, Swift, Scala, F# and Gleam options, and Haskell's Maybe. The owner accepts frozen SMT v1 fingerprint changes from this rename, and merges resolve in favour of these names. No frozen v1 receipt goes stale: a program fingerprint hashes the program's Core, which names Maybe's constructors only where the program uses them, and every v1 task in the corpus programs that use Maybe (bit-codec, chapter-06, native-payments, recursive-records) is unsupported, so it binds no fingerprint or script. Those four corpus sources must still be renamed. Recorded in CHANGELOG [Unreleased].
  opened: 0.26.0
  decided: 0.26.0

DEC-readable-output-default:
  status: decided
  question: How is generated code laid out?
  answer: |
    Readable by default for every runtime, test, adapter, declaration and scaffold. LawSpec prints the code itself: no formatter runs at generation time, layout is pure and deterministic, and the native and WASM builds give the same bytes. Each target follows a style profile (LawSpec.Code.Doc styleFor): its canonical formatter's default configuration where it has one (gofmt, rustfmt, ruff format, ormolu, mix format, gleam format, erlfmt, Prettier, ktfmt's kotlinlang style, scalafmt, swift-format, Fantomas, dotnet format, tofu fmt, cljfmt), otherwise Allman braces with Google's other rules (Java, Groovy), SWI-Prolog's conventional layout, block YAML and the conventional ANTLR and Make layouts. The output must equal that formatter's own output byte for byte: acceptance runs the pinned formatter in check mode on every generated project and fails on any difference (the formatted step). Every generated function, type, test and handler carries a one-line source link, label — file:line, with paths as the host sent them and no absolute paths or timestamps; files start with Generated by LawSpec from <spec>. Do not edit. (Go: Code generated by LawSpec. DO NOT EDIT.). --minify selects compact output, which is exempt from the formatter check. No regex rewriting of code. The owner set this direction on 2026-10-22, replacing PEP 8's 79 columns with ruff's 88; Python is the first target held to it (ruff format 0.17.2, pinned in test/locks/python.txt), and each family follows. Amended in 0.30.0. Recorded in to_be_removed/PLAN-0.9.md (Formatting).
  opened: 0.9.0
  decided: 0.9.0
  refs: [ruff-formatter, black-code-style, unicode-east-asian-width, google-style-guides, pep-8]

DEC-readable-generated-names:
  status: decided
  question: What names does generated code use?
  answer: |
    One naming service (LawSpec.Naming) decides them. Source names are kept, cased as the target writes them, with a keyword or reserved name escaped the target's own way (a trailing underscore in Python, raw identifiers in Rust); a collision gets _2, _3 in declaration order. Binders keep their source names; compiler-made binders are named by what they hold (selection, field). Tests are named from the law and the example (test_normalizers_agree__spaces_become_hyphens_punctuation_is_preserved); boundaries are numbered from 1. Helpers are named from the definition or type they serve (to_settings). A typed native function is the definition's plain name, with a suffix only on a real clash, so its name is the definition's name; a specialised copy is named from its definition and argument types (count_list_int32) while its Core identity keeps its digest. The machine width and the integers' draw limit are named once per module. Core identities never change: these are spellings only. Public generated names change in 0.30 (Python first, each family in turn); no migration is provided before 1.0, as the owner decided on 2026-10-22.
  opened: 0.30.0
  decided: 0.30.0
  refs: [pep-8]

DEC-record-display-names:
  status: decided
  question: What does generated code call an anonymous record?
  answer: |
    A structural record's identity stays the digest of its shape (Core's RecordIdentity), so Core fingerprints are untouched. Emitters show a display name (LawSpec.RecordNames) from the first place the record is used, in declaration order: a sum case's single payload is <Constructor>Details, a single-constructor type's field is <Type><Field>, a function's parameter or result is <Function><Parameter> or <Function>Result. Otherwise the field names joined name it, and Record_<8 hex digits> is the last resort, lengthened only on a collision. Names are computed once per program, so they are deterministic. Python uses them from 0.30; the other targets adopt them with their family.
  opened: 0.30.0
  decided: 0.30.0

DEC-native-string-literals:
  status: decided
  question: How does generated code write text?
  answer: |
    As the target's own string literal, from one deterministic escaping table per target (LawSpec.Code.Literal): printable characters as they are, the language's standard escapes, and only what the language requires escaped otherwise. Printability and display width come from LawSpec's pinned Unicode 17.0.0 tables (vendor/unicode), never the host's, so native and WASM output agree. Where a formatter picks the quote (ruff, Prettier) the table picks it the same way. A literal is one token: it is never chunked mid-word, and a long one stays whole, as the formatters leave it. Bytes are the target's bytes literal where it has one. Python uses this from 0.30, replacing tagged code-unit arrays; the other targets adopt it with their family.
  opened: 0.30.0
  decided: 0.30.0
  refs: [python-string-literals, unicode-east-asian-width]

DEC-rust-readable-output:
  status: decided
  question: How does generated Rust meet the readable-output decisions?
  answer: |
    Generated Rust equals rustfmt's output (1.97.1, edition 2024, default configuration), checked in acceptance with the pinned toolchain's rustfmt --check. LawSpec lays the code out itself with a Rust layout module (LawSpec.RustLayout): emitters build an expression's structure and the module applies rustfmt's widths (100 columns; 60 for a call's arguments, an array's items and a chain of several links; 18 for a struct literal's fields; 50 for a one-line if-else), its overflow of a last argument (with the 60-column budget of a nested call), its choice of a let's or a match arm's value on the same or the next line, and its last-link rule for chains. Where rustfmt's choice is hard to follow, the emitters write simpler statements (one decoded value a statement, handlers bound with their trait type instead of a cast). Each law is a module of tests named after it (law_<words>), with one #[test] per example, per boundary case and for its generated cases, or one exhaustive test for finite cases; a skipped or known-failing law stays one test. Generated files carry no blanket allow attributes: shared modules a test crate mounts carry #[allow(dead_code, unused_imports)] on the mount, and a function or struct that keeps a camel-case source name carries #[allow(non_snake_case)] on itself. Boilerplate lives in the runtimes: proptest's seed and failure database (ls_gen), expectations and call errors (ls::expect_equal, ls::called), handler locking (ls::locked, ls::answered), remote definitions and session listening.
  opened: 0.30.0
  decided: 0.30.0
  refs: [rustfmt]

DEC-adapter-ownership:
  status: decided
  question: Which files does generation own, and how does it avoid overwriting user code?
  answer: |
    Adapters, build files and application code belong to the user; tests, runtimes, data types, schemas, codecs, checked definitions and binding bridges are generated and listed with content hashes in .lawspec/generated.json. A generated file that was edited, or a file the manifest does not list, is never overwritten or deleted. Generation plans every write first and writes atomically, aborting if anything changed. Ownership and placement (source or test) are separate. Adapter updates compare a canonical readable reference of the stub, so formatting mode never causes a false update. Recorded in docs/explanation/ownership-and-regeneration.md and to_be_removed/PLAN-0.9.md.
  opened: 0.8.0
  decided: 0.9.0

DEC-native-bindings-typed-identity:
  status: decided
  question: How are LawSpec types and adapters connected to existing application models?
  answer: |
    Native bindings resolve against typed declaration identities and generate checked bridges; they never change the meaning of arithmetic, equality, definitions or refinements. Native generator factories return the framework's own generator so native shrinking is kept, while examples, boundaries and finite enumeration still run. Adopting a binding over an existing adapter requires moving it aside rather than overwriting it. Recorded in CHANGELOG 0.10.0 and docs/explanation/ownership-and-regeneration.md.
  opened: 0.10.0
  decided: 0.10.0

DEC-indexed-families-as-evidence:
  status: decided
  question: How does LawSpec take its first step towards dependent types without changing target type systems?
  answer: |
    Natural-indexed families. Indices are evidence, checked and discharged at test time through refinements: a family elaborates to erased data, one total structural measure per index, and a refinement on every occurrence, so dependent signatures become checked contracts. Index-directed generation solves child indices backwards per constructor in all seven runtimes. Recorded in to_be_removed/PLAN-0.11.md.
  opened: 0.11.0
  decided: 0.11.0

DEC-proof-producing-index-layer:
  status: decided
  question: Which index claims does the compiler prove, and what happens to the rest?
  answer: |
    The prover normalises and solves decidable Natural arithmetic (linear sums, call congruence, one-step unfolding on known constructors, non-negative measures) and records each obligation as proved or runtime-checked in Core evidence, reported in the API and lawspec check. Generated definitions omit proved postconditions. An unproven claim stays a runtime-checked contract; from 0.16 products and powers are uninterpreted atoms and non-linear claims are checked on each result. Recorded in to_be_removed/PLAN-0.12.md and PLAN-0.16.md.
  opened: 0.12.0
  decided: 0.16.0

DEC-evidence-statuses:
  status: decided
  question: How does LawSpec report what a passing suite actually establishes?
  answer: |
    Every obligation carries one of five statuses, strongest first: proved, exhaustively checked, property tested, runtime checked, and assumed (native code LawSpec cannot see). Laws over checked definitions are proved or evaluated on finite domains at compile time, so a false one is a refuted diagnostic with its counterexample; they are still emitted as tests to check each target's generated code. Adapters are assumed, and an adapter no law calls is reported. The aim: specify, prove what can be proved, and account for the rest. Recorded in docs/explanation/evidence-and-discharge.md, to_be_removed/PLAN-0.12.md and CHANGELOG 0.15.0.
  opened: 0.12.0
  decided: 0.15.0

DEC-environment-attestation:
  status: decided
  question: How does lawspec evidence say which obligations were tested against stand-ins rather than the real dependencies?
  answer: |
    By reading an environment attestation, a versioned JSON document any tool may write, that records for one run in one environment each dependency's endpoint and whether it was the real dependency or a stand-in, with the stand-in's identity, version and declared conformance level. A dependency is matched by name to an ability's resolved identity, whose production handler a law runs under, or to a native adapter or bound function a law calls; each law whose tests ran is reported with the environment and the dependencies it ran against. It is reporting only, like the harness plane: no status changes and no law means anything different. lawspec test stores the attestation with the run's results, so a later lawspec evidence shows it. Recorded in docs/reference/language/evidence-and-discharge.md and CHANGELOG [Unreleased].
  opened: 0.21.0
  decided: 0.21.0

DEC-completed-run-attestation:
  status: decided
  question: How does lawspec evidence tell planned wiring from a completed run, and what does a completed run identify?
  answer: |
    By the attestation's own record and LawSpec's results together. A named attestation links a planned native law check to its run as completed only when lawspec test recorded the law under the attestation's run id and the attestation's execution status is completed or absent; wired and running stay planned and say why. A linked law carries its recorded outcome and the run's exit code. Each dependency reports whether the real provider or a fixture implemented it, its contract, node and edge, and the history it ran against (the completed history digest, else the stand-in's); the run reports the architecture, topology and application identities. Results are keyed by wiring only (endpoint, kind, stand-in product, version and conformance), never by what the run observed, and an environment attestation inside the project, recognized by its format, is not a project input. It remains reporting only: no status changes. Recorded in docs/reference/language/evidence-and-discharge.md and CHANGELOG [Unreleased].
  opened: 0.26.0
  decided: 0.26.0

DEC-domain-modeling-primitives:
  status: decided
  question: How does LawSpec express domain types whose illegal states are unrepresentable?
  answer: |
    Wlaschin-style wrappers and workflows. A wrapper is a nominal single-constructor product with a refined value field, checked at construction in examples, generators and native decoding. A workflow composes adapter steps with a type-checked chain and a generated composition law; from 0.18 workflows are generated on every target with railway combinators, typed errors per step and resilience policies. Recorded in to_be_removed/PLAN-0.13.md and CHANGELOG 0.18.0.
  opened: 0.13.0
  decided: 0.18.0
  refs: [wlaschin-domain-modeling, wlaschin-railway]

DEC-imports-copy-not-link:
  status: decided
  question: How do units share laws and definitions across files and packages?
  answer: |
    Imports are resolved before type checking. Data stays with its declaring unit; refinements, checked definitions and generic laws are copied into the importer with the closure of what they use, under unit-derived names, so nothing after resolution knows about imports. Adapters and concrete laws are not importable. Packages carry semantic versions and ranges, and a unit sees only its own package and direct dependencies. Recorded in to_be_removed/PLAN-0.14.md.
  opened: 0.14.0
  decided: 0.14.0
  refs: [semver-2]

DEC-gadts-and-index-arithmetic:
  status: decided
  question: How far do 0.16's dependent types go?
  answer: |
    GADTs refine type arguments per constructor, with branch-local givens, inaccessible-branch pruning, polymorphic self-recursion (specialisation stops at 64 instances) and field-only existentials carried as Text witness fields. Index arithmetic covers + - * div mod ^, with subtraction guarded by >= and shared variables by ==, checked at construction and decode; runtimes reach indices forward to target plus 16 and solve backwards. Recorded in to_be_removed/PLAN-0.16.md.
  opened: 0.16.0
  decided: 0.16.0

DEC-flow-typing:
  status: decided
  question: How does LawSpec type a state whose type changes with each call, as stateful models need?
  answer: |
    Flow typing after Wilshaw and Hutton: a parameter A / A' is a state that changes type per call, checked left to right; a flow function elaborates to one returning a generated product indexed by the output state, and calls desugar to nested matches. 0.16 allowed one flow parameter per function and no flow calls in branches; 0.20 lifted both. Stateful models in 0.19 reuse it for typestate. Recorded in to_be_removed/PLAN-0.16.md.
  opened: 0.16.0
  decided: 0.20.0
  refs: [wilshaw-hutton-flow-typing]

DEC-portable-total-order-collections:
  status: decided
  question: How do Set and KeyVal behave identically on every target?
  answer: |
    A portable total order (Keyed, derived over stored fields) implemented once in Core and in every runtime: exact numbers by value, text and sequences by code point or unit, false before true, absent before present, lists lexicographically, data by tag then fields. Collections are a generated LawSpec unit of ordinary data with checked definitions; Core requires sorted, duplicate-free values and every codec canonicalises. Natives use idiomatic sets and maps where the target compares by value, otherwise immutable canonical structures. Values are validated at adapter boundaries rather than on every construction, to keep recursive collections fast. Recorded in to_be_removed/PLAN-0.17.md.
  opened: 0.17.0
  decided: 0.17.0

DEC-async-native-tasks:
  status: decided
  question: How are asynchronous adapters represented on each target?
  answer: |
    As each target's own task abstraction (coroutine, Promise, CompletableFuture, suspend fun, goroutine task, IO, Rust future), awaited where called by the generated tests; native bindings for async adapters followed in 0.20. Recorded in to_be_removed/PLAN-0.17.md and CHANGELOG 0.20.0.
  opened: 0.17.0
  decided: 0.20.0

DEC-stateful-models-linearizability:
  status: decided
  question: How are stateful systems and concurrent objects checked?
  answer: |
    A model pairs commands with a reference state and a checked definition per command; runs are generated and shrunk portably. Shared models also run in parallel, and each history must be linearizable (Wing and Gong), checked key by key for sets and maps; consistency sequential, causal or eventual relaxes this for replicated systems. Models, channels, actors and supervision ship together in 0.19 (owner decision 2026-10-04). Recorded in CHANGELOG 0.19.0.
  opened: 0.19.0
  decided: 0.19.0
  refs: [wing-gong-linearizability, herlihy-wing-linearizability]

DEC-sessions-by-construction:
  status: decided
  question: How are scenarios over channels made deadlock-free and race-free?
  answer: |
    By construction, following propositions as sessions (Caires and Pfenning; Wadler): channel ends have one owner and sending an end gives it up, channels and mailboxes join processes in a tree, and delegation keeps the tree, so lawspec evidence lists each scenario as proved deadlock-free and race-free. Failures are affine: a receive from a failed process fails or runs its or else rather than blocking. Protocols become typed channel ends per step on every target. Recorded in CHANGELOG 0.19.0 and docs/reference/language/scenarios.md.
  opened: 0.19.0
  decided: 0.19.0
  refs: [caires-pfenning-session-types, wadler-propositions-as-sessions]

DEC-priorities-beyond-trees:
  status: decided
  question: How may scenarios close cycles between processes without losing deadlock freedom?
  answer: |
    Priorities on channel steps in the style of Padovani and Kobayashi: a cycle is accepted when no process can wait for another in a cycle, and the waits are named when one could. Scenarios with mailboxes or or else keep the tree rule. The 0.19 core stays processes, one-shot slots and MPSC mailboxes, relaxing topology only through priorities. Recorded in CHANGELOG 0.20.0.
  opened: 0.19.0
  decided: 0.20.0
  refs: [padovani-deadlock-freedom, kobayashi-deadlock-free-processes]

DEC-actors-otp-supervision:
  status: decided
  question: How are actors and failure handling modelled?
  answer: |
    Actors own a state and handle one message at a time with plain handler functions, are checked like shared models with injected crashes, and are generated as typed actor classes on every target. Supervisors restart children one for one, one for all or rest for one, with permanent, transient or temporary children and restart limits escalating upwards, plus links and monitors, after Erlang/OTP; BEAM targets come later. Recorded in CHANGELOG 0.19.0.
  opened: 0.19.0
  decided: 0.19.0
  refs: [erlang-otp-supervisors]

DEC-distribution-canonical-wire:
  status: decided
  question: How do values and channel ends cross between nodes?
  answer: |
    One canonical wire encoding, the same bytes on every target and checked against shared vectors; calls and mailbox sends are resent until answered and run once; channels number, acknowledge and resend. In 0.20 a networked channel end migrates (its state moves and the peer learns the new address) instead of being relayed; local ends are still relayed. Remote evaluation is by content hash. Recorded in CHANGELOG 0.19.0 and 0.20.0.
  opened: 0.19.0
  decided: 0.20.0

DEC-readable-notation:
  status: decided
  question: How should LawSpec's surface syntax read?
  answer: |
    To an ordinary programmer, not only to a type theorist: every symbol has a plain keyword form, keywords come first and symbols are aliases (send, receive, par ... with ..., bind for >>=), and examples are judged by whether a non-specialist can read them aloud. Owner instruction during 0.18 and 0.19 design, folded here from tool memory.
  opened: 0.18.0
  decided: 0.19.0

DEC-incremental-compilation:
  status: decided
  question: How does the compiler avoid redoing work when a project changes a little?
  answer: |
    A recursive incremental build rather than flat keys, shipped as patches before 0.18: 0.17.2 Merkle dependency digests (SHA-256) of types and declarations decide which laws to replan and units to re-emit; 0.17.3 keys each law's expansion and elaboration by exactly its inputs and adds an on-disk cache in .lawspec/cache, on by default (--no-cache or cache false turns it off); 0.17.4 lawspec test runs only laws whose results may have changed. Adapter staleness is per package and conservative: any changed non-generated source marks every adapter-calling law stale, as does any change to the compiler, runtime or generated test code a law runs on; a property test is skipped with its recorded seed only when none of these changed. Owner decisions of 2026-10-02, recorded in CHANGELOG 0.17.2 to 0.17.4.
  opened: 0.17.1
  decided: 0.17.4

DEC-wasm-distribution:
  status: decided
  question: How is the Haskell compiler distributed to JavaScript users?
  answer: |
    Built natively for development and to WebAssembly with GHC's wasm backend for the npm package, with both builds required to produce byte-identical output (the parity check). npm/build.json fingerprints every compiler source and artifact so a published package can never pair a WASM build with different sources. The public API uses explicit wire views (schema 3 onward), not serialized internals. Recorded in docs/explanation/how-the-compiler-works.md and CHANGELOG 0.8.0 and 0.13.1.
  opened: 0.8.0
  decided: 0.13.1
  refs: [ghc-wasm]

DEC-generated-javascript:
  status: decided
  question: Where do the repository's JavaScript files and the facts they repeat come from?
  answer: |
    Every JavaScript file is generated from templates/ by lawspec-dev generate, with the version, targets, scaffolds and test commands filled in from the Haskell sources, and generate --check fails on stale or stray scripts. Repository checks moved from JavaScript to Haskell in 0.13.1. The compiler's facts are no longer copied by hand. Recorded in CHANGELOG 0.13.1 and 0.15.1.
  opened: 0.13.1
  decided: 0.15.1

DEC-local-ci-only:
  status: decided
  question: Where does LawSpec's continuous integration run?
  answer: |
    Locally only. Hosted CI (GitHub Actions) was removed on 2026-09-29 at the owner's instruction; stack run lawspec-dev -- ci (make ci) runs the complete check, logging to .artifacts/ci, with content-addressed results since 0.17.1 so unchanged steps are cached, and make ci-fresh runs everything for releases. New checks are steps in dev/Ci.hs; nothing is gated on remote runners. Recorded in CHANGELOG 0.13.2 and 0.17.1.
  opened: 0.13.2
  decided: 0.17.1

DEC-release-cadence:
  status: decided
  question: Which changes are minor releases and which are patches?
  answer: |
    Minor releases (0.x.0) are roadmap milestones in docs/explanation/roadmap.md; everything else, tooling, documentation, refactors and fixes, ships as a patch (0.x.y), and a large off-roadmap effort may span several consecutive patches, as incremental compilation did across 0.17.2 to 0.17.4. Versions follow Semantic Versioning, and every versioned file is set by lawspec-dev bump from package.yaml. npm versions are immutable: never overwrite or unpublish; deprecate and release the next patch. Recorded in RELEASING.md and owner instructions.
  opened: 0.13.1
  decided: 0.17.2
  refs: [semver-2, lawspec-roadmap]

DEC-acceptance-with-mutants:
  status: decided
  question: What counts as evidence that a feature works on a target?
  answer: |
    An acceptance suite that runs the generated tests for real on all eight targets in both machine profiles and readable and compact layouts, and rejects deliberately wrong adapters (mutants) as well as bare stubs; a mutant that only breaks the build fails the suite. Adapters and mutants are real files under acceptance/, run by lawspec-acceptance. Unmaintained integration scripts were removed in 0.15.1. Recorded in to_be_removed/PLAN-0.9.md to PLAN-0.17.md (Acceptance sections), ACCEPTANCE-0.9.md and CHANGELOG 0.13.1.
  opened: 0.9.0
  decided: 0.13.1

DEC-diataxis-docs:
  status: decided
  question: How is the documentation organised?
  answer: |
    As a Diátaxis site in docs/ (tutorials, how-to guides, reference, explanation), built by lawspec-dev docs, whose snippets all compile and whose links all resolve; it replaced the README's history, per-target guides, LANGUAGE.md and the other root documents, and the changelog collects release notes. Tutorials have Java, Python and JavaScript tracks backed by the lessons acceptance suite. Recorded in CHANGELOG 0.15.1.
  opened: 0.15.1
  decided: 0.15.1
  refs: [diataxis, commonmark]

DEC-idiomatic-generated-types:
  status: decided
  question: What shape do generated data types take on each target?
  answer: |
    The types a programmer would write by hand, so adapters never cast: a product is a record, data class, plain struct or Rust struct named after its type, and a sum is a closed family the language's own pattern matching checks for exhaustiveness (Java sealed interfaces of records, Kotlin sealed classes with data objects). Recorded in CHANGELOG 0.15.2.
  opened: 0.15.2
  decided: 0.15.2

DEC-recovery-not-regeneration:
  status: decided
  question: After the 2026-09-26 accidental deletion, how was lost 0.9 work restored without trusting stale copies?
  answer: |
    Runtimes were recovered verbatim from the embedded RuntimeSources.hs rather than regenerated from the committed 0.8 baseline; lost tests and harnesses were reconstructed and re-verified fresh, historical logs guiding but never substituting for verification, and no claim was made that the original suite was restored. Recorded in to_be_removed/RECOVERY.md.
  opened: 0.9.0
  decided: 0.9.0

DEC-field-access-desugars-to-match:
  status: decided
  question: How do field access (b.f) and record update (b with f = v) reach Core and the targets?
  answer: |
    Inference types each directly once the value's type is known, without visiting the record's other fields, and keeps it as a field node; in a checked definition it is Core's Project (b.f) or Update (b with f = v), which validation, evaluation and the totality audits read directly, so a record of hundreds of fields costs one node per access rather than one binder per field (lawspec-dev bench compile). The testing plan and every emitter see each as the match on the single constructor it stands for (lowerFieldNodes), so the backends are unchanged; a law's terms are lowered when they are elaborated. The totality audit reads b.f as an atom (Field), so a guard on b.f is a fact about the field, and an update as the match it stands for, so the constructor's contract holds of the fields it keeps. Generic and existential records keep the match from the start. Recorded in docs/reference/language/types-and-data.md.
  opened: 0.21.1
  decided: 0.21.1

DEC-fsharp-runtime-from-scratch:
  status: decided
  question: How does LawSpec reach .NET, as a port of the Java runtime or as a runtime written for F#?
  answer: |
    A runtime written for F#, not a port. Portable values are an F# union, failures are Result and typed exceptions, abilities are interfaces with bridges to logical handlers, async is Task, and actors, sessions and mailboxes are F# types over the shared wire format, so generated code and adapters read as F# written by hand. The emitter shares one intermediate form for F# and C#, binding block constructs to fresh locals so F#'s offside rule never meets an expression. Tests run on xunit.v3; properties run on FsCheck (DEC-dotnet-fscheck), and models, linearizability and scenarios on the runtime's own model runner. Decided by the owner for 0.23.0.
  opened: 0.23.0
  decided: 0.23.0

DEC-dotnet-fscheck:
  status: decided
  question: The .NET targets ran properties on LawSpec's own engine (seeded SplitMix64, size schedule, integrated shrinking) while every other target uses its ecosystem's property library. Which library runs .NET properties, and how do LawSpec's generators and harness sit on it?
  answer: |
    FsCheck 3.4.0, driven programmatically from the generated xUnit v3 facts (Check.One with a Config and a runner that keeps the TestResult), so xUnit v3 stays the test framework and FsCheck.Xunit's attributes are not used. LawSpec.Testing's Gen is an FsCheck generator of a shrink tree: FsCheck draws every random choice and gives the size, and LawSpec builds, for each value, the tree of smaller values it may shrink to, so a bound input's shrink regenerates its dependants from the same random state and size and every candidate stays inside the refinement, as on the other targets. Property.check makes it an Arbitrary whose shrinker walks the tree, limited to maxShrinks steps; cases map to MaxTest, maxAttempts to MaxRejected (as Hedgehog's withDiscards), sizes grow from 0 to 100 over the run (and with each discard, capped at 100), and LAWSPEC_SEED seeds FsCheck's Replay. Strategies, cover, classify and labels (LawSpec's own counters, as everywhere), targeted search, the failure database in the wire encoding, repeats, retries, timeouts, order and parallel units and benchmarks stay in the harness around it. A harness failure (a strategy outside its refinement or out of discards) ends the run without being shrunk. Generator bindings return an FsCheck Arbitrary, keeping its shrinker. Decided by the owner for 0.23.0.
  opened: 0.23.0
  decided: 0.23.0
  refs: [fscheck]

DEC-beam-property-libraries:
  status: decided
  question: Which property library runs laws on each BEAM language, and is it still the best choice now that checked definitions and handlers run typed there?
  answer: |
    The ones 0.22 adopted, unchanged: PropEr 1.5.0 for Erlang, StreamData 1.4.0 for Elixir and qcheck 1.0.5 for Gleam, each driven through LawSpec's generator plan and harness (lawspec_beam_proper, lawspec_beam_stream_data, lawspec_beam_qcheck), seeded by LAWSPEC_SEED and shrinking inside refinements. The typed path in 0.24 changes what a law calls, not how its inputs are drawn or shrunk, so no generator moves. The alternatives were reviewed for 0.24. Erlang - Quviq QuickCheck is commercial and its free QuickCheck Mini is closed and limited, so it cannot be a generated project's dependency; triq is open but sees little maintenance and has fewer shrinking and stateful features than PropEr; PropEr is maintained, has integrated shrinking, stateful and targeted testing, and is a test-only dependency. Elixir - PropCheck wraps PropEr, which would give Elixir PropEr's model and a second wrapper, while StreamData is the ecosystem's standard (ExUnitProperties), maintained alongside Elixir itself and written in Elixir. Gleam - qcheck is the maintained, documented property library with integrated shrink trees; the other Gleam packages are small or dormant. Each choice stays the best-maintained option for its language; revisit when one of them stops being maintained.
  opened: 0.24.0
  decided: 0.24.0
  refs: [proper, stream-data, qcheck]

DEC-swift-runtime-from-scratch:
  status: decided
  question: How does LawSpec reach Swift, as a port of another runtime or as a runtime written for Swift?
  answer: |
    A runtime written for Swift 6, with no package dependencies. Portable values are a Swift enum with indirect cases and LawSpec's own BigInt; data types are structs and enums with associated values (indirect where recursive) that compare by LawSpec's order through the Portable protocol, since Swift compares a String by canonical equivalence and LawSpec by code point; List, Set and KeyVal are the runtime's persistent PersistentList, SortedSet and SortedMap (DEC-swift-persistent-list). A failure an adapter, operation or definition declares is a typed throw, throws(E), and the runtime raises LawSpecError and RaisedFailure. Abilities are protocols with bridges to logical handlers; async adapters are async functions that the synchronous runtime awaits on its own large-stack threads, never on the cooperative pool. Actors are the runtime's supervised mailboxes on runtime threads, with async overloads for Swift callers (DEC-swift-actors-on-runtime-threads); sessions, mailboxes and the secure network speak the shared wire format, and lawspec.crypto uses CryptoKit, with pure Swift fallbacks only where CryptoKit lacks an operation. Projects are SwiftPM packages tested with Swift Testing; properties run on the runtime's engine (DEC-swift-property-library). Decided by the owner for 0.24.0.
  opened: 0.24.0
  decided: 0.24.0

DEC-swift-property-library:
  status: decided
  question: Every target runs properties on its ecosystem's property library. Which library runs Swift properties, and how do LawSpec's generators and harness sit on it?
  answer: |
    No maintained Swift library fits, so the runtime has a small engine driven by Swift Testing, the one exception to running on a standard property library. The survey (October 2026): SwiftCheck has had no release since 2019 and no Swift 6 support; PropertyBased 2.0.1 (x-sheep/swift-property-based, MIT, no dependencies, Swift Testing integration) has no bind or size, so no dependent generation, seeds each case from the system generator so one seed cannot replay a run, runs a fixed seed for one case only, and shrinks per type without a step limit; Exhaust 1.5.8 (nesevis/exhaust) shrinks recorded choices inside filters and binds, but its next release already needs Swift 6.4, it releases several times a day, pulls in swift-syntax and macros and, on macOS, a binary framework downloaded from GitHub, and fingerprints generators by source location, which generators built at runtime from a schema share; swift-gen generates without shrinking or a runner; SwiftQC, swift-test-kit, hegel-swift, Premise and PropertyTestingKit are dormant, pin branches, clash with the toolchain's Testing, vendor a native engine or need a patched compiler; and Swift Testing itself has only fixed parameterized arguments. The engine is LawSpec.Testing's Gen, as on .NET before FsCheck: a generator draws from the portable SplitMix64 sequence at a size and builds each value's shrink tree, so a bound input's shrink regenerates its dependants from the same random state and every candidate stays inside the refinement. Property.check draws cases at sizes growing from 0 to 100 over the run and with each discard, discards up to maxAttempts, shrinks the first failure along its tree for at most maxShrinks steps, and prints the run's seed, which LAWSPEC_SEED replays. Strategies, cover, classify and labels, targeted search, the failure database, repeats, retries, timeouts, order, parallel units and benchmarks stay in the harness around it, as on every target. Revisit when a maintained library offers bind, sizes, seed replay of a whole run and shrinking inside filters without dependencies the generated packages cannot build offline. Decided by the owner for 0.24.0.
  opened: 0.24.0
  decided: 0.24.0
  refs: [swift-testing]

DEC-swift-actors-on-runtime-threads:
  status: decided
  question: Are LawSpec's Swift actors Swift actor types, which run on the cooperative pool, or the runtime's supervised mailboxes on threads of their own?
  answer: |
    The runtime's supervised mailboxes, each draining on a runtime thread, with the supervision tree, restart budgets, links and monitors of DEC-actors-otp-supervision. A handler runs LawSpec code, which is synchronous and may block (an async adapter is awaited by the runtime, an actor may call another actor), and blocking inside a Swift actor starves Swift's cooperative pool. So the generated actor classes are Sendable classes rather than Swift actor types; each message has a blocking method for synchronous code and an async overload of the same name that awaits the reply on a runtime thread, so async Swift code writes try await account.deposit(5) as it would with a Swift actor. This departs from the plan's Swift actors; revisit if the runtime gains an async evaluator.
  opened: 0.24.0
  decided: 0.24.0

DEC-swift-persistent-list:
  status: decided
  question: Which Swift type represents LawSpec's List, given that typed definitions recurse over lists and spec handlers keep lists in their state?
  answer: |
    The runtime's PersistentList, a singly linked list whose prepend, first item and rest take constant time and share structure. Swift's Array is a value type that copies on change, so a definition that walks a list with its rest, or prepends to a log kept in a handler's state, copies the whole list at each step; the Kafka benchmark's produce and consume phases grew quadratically with it (0.8 s and 2.3 s at 100,000 records, minutes at a million). PersistentList is a Sequence and ExpressibleByArrayLiteral, so adapters iterate it, map it and make one from a literal, and Array(list) gives an Array. Bytes, Utf16Text and CodePointText stay arrays of scalars, which LawSpec never walks item by item. Its nodes are released one at a time, so dropping a long list never exhausts the stack.
  opened: 0.24.0
  decided: 0.24.0

DEC-csharp-over-fsharp:
  status: decided
  question: How does LawSpec support C#, with a second runtime or over the F# one?
  answer: |
    C# over F#. The program's model (data types, codecs, ability interfaces and bridges, schema, actors, sessions and mailboxes) is a generated F# project the C# project references, and adapters, entries, the embedding API and tests are C#. Functional idioms stay: F# records, unions, lists and options are what C# adapters see. Where they are awkward from C#, a compatibility layer (LawSpec.CSharp) gives delegates as F# functions, lists, tuples, options, results and value constructors, and every public runtime function has a PascalCase compiled name. C# binds functions, handlers and failures but not types, since the model compiles before any C# code. Decided by the owner for 0.23.0.
  opened: 0.23.0
  decided: 0.23.0

DEC-groovy-over-java:
  status: decided
  question: How does LawSpec support Groovy, with a runtime of its own or over the Java target?
  answer: |
    Groovy over Java, as C# runs over F# (DEC-csharp-over-fsharp). Groovy reads Java's types directly, so the program's model is the Java target's (data types as records and sealed interfaces, codecs, ability interfaces, checked definitions, schema, actors, sessions, mailboxes, the network and the secure handler), and Gradle compiles it jointly with the Groovy sources (src/main/java is a Groovy source root). What a user writes or reads is Groovy: the adapters and native handlers are Groovy classes under src/main/groovy, type-checked with @CompileStatic, and each unit's laws are a Spock specification under src/test/groovy, a feature per test named in words ("integer promotion: example 0"). Generated Java becomes Groovy by its literals alone, since Groovy 5 parses Java's statements, lambdas, records, switch expressions and array initializers: strings are single-quoted, so $ never interpolates, and character literals are cast to char. Groovy's own keywords (as, def, in, trait) are escaped in user names. Decided for 0.24.0.
  opened: 0.24.0
  decided: 0.24.0
  refs: [spock]

DEC-groovy-property-library:
  status: decided
  question: Which property library runs Groovy's properties, under which test framework?
  answer: |
    Spock runs the tests and JetCheck runs the properties, with LawSpec's generators, as on Java (DEC-native-property-frameworks). The survey: jqwik (EPL-2.0) is the JUnit platform's best-known property engine and works from Groovy, but it is in maintenance mode (no further feature development), its properties need its own engine, whose seed is an annotation constant, so LAWSPEC_SEED cannot replay a run, and its generators refuse to run outside that engine (a list generator needs a jqwik thread); since 1.10 its engine also prints, on every run, a notice addressed to AI agents asking them not to use the library and to ignore its results, which would sit in every report LawSpec reads. A Spock feature cannot be a jqwik property, so Spock with jqwik means two engines and two kinds of test. spock-genesis, the Groovy generator library for Spock, has had no release since 2016; junit-quickcheck and QuickTheories are inactive. JetCheck (Apache-2.0, JetBrains, used in IntelliJ's own tests) is already LawSpec's JVM engine: its integrated shrinking works on the draws a generator made, so a shrunk value is always one the generator, and its refinement filters, can make, and LawSpec's refined cases shrink through the refinement's own acceptance check. A JetCheck check is a plain call, so it runs inside a Spock feature, seeded by LAWSPEC_SEED; Spock gives the features, skips (@Ignore), order (an annotation-driven extension that shuffles features by the seed) and concurrency (@Execution with SpockConfig.groovy), and Gradle writes the JUnit XML report. Decided for 0.24.0.
  opened: 0.24.0
  decided: 0.24.0
  refs: [spock, jetcheck, jqwik]

DEC-clojure-over-java:
  status: decided
  question: How does LawSpec support Clojure, and what do Clojure adapters see?
  answer: |
    Clojure over Java. The program's model is the Java target's, in java/src, compiled by the JDK's compiler into target/classes (lawspec.build, before the tests or with clojure -M:build). What a user writes is Clojure: each unit's adapters are functions of a namespace (example.parse_port is example.parse-port in src/example/parse_port.clj), and a native handler is a function returning a map of its operations. A generated Java bridge with the stub's class and methods calls them through lawspec.clojure.LawSpecClojure, which converts at the boundary, directed by the Java types the model expects. Data crosses as Clojure data: a data type's value is a map whose :lawspec/tag keyword names its constructor, the type's name as namespace and the constructor's as name, both kebab-case ({:lawspec/tag :payment/approved, :cents 500}), with its fields under kebab-case keys; a constructor without fields is its tag alone (:payment/declined). The names are the Java model's, so two units' types of one name carry their units' names (:shop-orders-currency/gbp). Lists are vectors, sets and key-value maps are Clojure's, integers are longs or bigints, Maybe is nil or its value, and Either is [:left x] or [:right x]. An adapter fails with (lawspec.clojure/fail failure), an ex-info whose data holds :lawspec/failure; ability handlers are called with (lawspec.clojure/op handler :operation args). Each unit's laws are clojure.test tests over generated Java law cases, one per case, named in kebab case with the kind after a double dash, and a test-ns-hook runs them by the harness's schedule. lawspec.json binds functions, handle constructors and methods, handlers, failures (an ex-info's :type) and generators (functions returning test.check generators) to Clojure, with underscores in its names for Clojure's hyphens; Clojure binds no types: a Clojure program uses the model's data. Decided for 0.24.0.
  opened: 0.24.0
  decided: 0.24.0
  refs: [test-check]

DEC-clojure-property-library:
  status: decided
  question: Which property library runs Clojure's properties?
  answer: |
    test.check (EPL-1.0, Clojure contrib), through clojure.test with defspec-style tests. The survey: test.check is the Clojure ecosystem's property engine; clojure.spec's generators (clojure.spec.gen.alpha) and Malli's (malli.generator) are both built on it rather than alternatives to it, and describe values by specs or schemas, not by LawSpec's plans; test.chuck only adds generators to it. Its generators are rose trees, so LawSpec builds each input's tree itself from its plan: the children of a value are the smaller values its domain gives, kept only when the refinement still holds, and a dependent input is regenerated from the same seed when the inputs before it shrink. quick-check takes :seed, so LAWSPEC_SEED replays a run, and its result carries the shrunk case for the report. Decided for 0.24.0.
  opened: 0.24.0
  decided: 0.24.0
  refs: [test-check, clojure-spec, malli]

DEC-canon-constructor-haddock:
  status: decided
  question: canon's Haskell grammar reports a Haddock comment written before a constructor alternative of a data type (`-- | ...` above `| Ctor Field ...`) as "doc comment is not attached to any unit", an OrphanDocComment that no exemption covers. The code is valid Haskell and the comment is where Haddock expects it. What does LawSpec do until canon is fixed?
  answer: |
    The code stays as written. Until canon attached such a comment, canon.yaml ignored src/LawSpec/DotNet/Code.hs, the one file this affected (the constructors of its Expr type), as a temporary entry naming this decision. canon 0.2.2 fixes it (canon's DEC-haskell-constructor-haddock): the Haskell dialect binds a Haddock comment before a constructor's bar or equals sign to that constructor. The ignore entry is removed, and canon check reads Code.hs again.
  opened: 0.23.0
  decided: 0.23.0
  refs: [canon]


DEC-parallel-ci:
  status: decided
  question: The complete check has hundreds of steps and took hours one after another on an 18-core machine. How does it run them in parallel without letting steps interfere?
  answer: |
    lawspec-dev ci --jobs N (LAWSPEC_CI_JOBS, half the processors by default) runs steps on a worker pool (dev/scheduler/Scheduler.hs). Each step declares the steps it follows and the resources it claims, shared, exclusive or counted, and dev/Ci.hs's plan names them: a target's .integration environment (written by its bootstrap and the BEAM framework steps, read by its suites), each acceptance project directory, the repository's .stack-work (every stack run, build or test may reconfigure and rebuild the package, so they run one at a time, and compiler-tests and build-acceptance reinstall lawspec-acceptance, so no suite runs beside them), Stack's snapshot database, the runtime crate's Cargo target, and a timing class for suites that wait on the real clock. Haskell and Java suites follow their target's crypto suite, which fills Stack's snapshot and Maven's repository alone, since neither guards concurrent installation. A step follows others in order only, never on their success, so a parallel run executes the same steps as a sequential one and reports the same failures, in step order; --jobs 1 is the sequential run exactly. Steps run in process groups that Ctrl-C stops. The npm package's prepack replaces its copied documents by rename, since several steps pack npm/ at once.
  opened: 0.23.0
  decided: 0.23.0

DEC-scala-on-the-jvm-runtime:
  status: decided
  question: How does LawSpec reach Scala, with a runtime of its own or over the JVM runtime Java and Kotlin share, and which build tool runs a generated project?
  answer: |
    Over the shared JVM runtime, as Kotlin is: LawSpecRuntime.java and its schema, the typed definitions (LawSpec.Typed.Jvm), the bodies of checked definitions, actors, supervisors, sessions, mailboxes, remote evaluation and the secure network are the Java ones, and a thin Scala layer sits on them. Products are final case classes and sums are Scala 3 enums (a case without fields is a singleton, one of a generic enum a class case, and a GADT case extends the enum at the type it refines to); the built-in types are Scala's immutable ones, List, Option, Either, Set, Map, Queue, Vector, BigInt, BigDecimal with an unlimited context (Scala's default context would round to 34 digits), FiniteDuration and IArray; abilities are traits; an adapter or operation that fails with E returns Either[E, R], whose Left the bridge raises as the failure; async adapters return Future. Generated Scala uses braces, so the compact profile, which joins optional lines, never meets Scala's indentation rules. Scala's types meet typed code through their codecs (JvmStyle ScalaStyle), not through direct conversions. Generated projects build with Scala CLI 1.16, the scala command Scala 3.5 made official, from project.scala's directives: it compiles Java and Scala together, keeps compilations incremental on its Bloop server across the many projects CI builds, and runs ScalaTest. The sources keep sbt's layout (src/main/scala, src/main/java, src/test/scala), so `scala --power export --sbt` gives an sbt build. Decided for 0.24.0.
  opened: 0.24.0
  decided: 0.24.0
  refs: [scala-cli, scalatest]

DEC-scala-property-library:
  status: decided
  question: Which property library runs Scala's laws, and how do LawSpec's generators sit on it? The candidates for Scala 3 in October 2026 are ScalaCheck, Hedgehog for Scala, ZIO Test's generators, ScalaTest 3.3's own and scalaprops.
  answer: |
    ScalaCheck 1.20.0, driven from ScalaTest 3.2.19's AnyFunSuite, with LawSpec's shrink trees. The survey: ScalaCheck (BSD-3-Clause, released monthly, the ecosystem's standard, integrated with ScalaTest, MUnit and specs2, replayable Seed) shrinks separately, by a type's Shrink, so a shrunk value can leave a generator's invariants. Hedgehog for Scala (Apache-2.0, 0.15.0 of September 2026, Scala 3, runners for sbt and MUnit) shrinks integrated, with trees, but few projects use it. ZIO Test (Apache-2.0) shrinks integrated through Sample streams, but its tests are ZIO effects run by its own runner, which a plain Scala project would have to adopt. ScalaTest 3.3's integrated generators exist only as alphas and snapshots, and scalaprops (MIT) is little used. As on .NET (DEC-dotnet-fscheck), the standard library carries LawSpec's model rather than replacing it: lawspec.testing.Arb draws a value and the tree of smaller values it may shrink to, from ScalaCheck's own Seed, so every random choice is ScalaCheck's; LawSpecProperty.checkAll makes the tree a ScalaCheck generator whose Shrink (Shrink.withLazyList) walks the tree, so ScalaCheck shrinks and reports, every candidate stays inside its refinement, and a bound input's shrink redraws its dependants. cases map to minSuccessfulTests, maxAttempts to the bounded redraws of a refinement, and LAWSPEC_SEED seeds ScalaCheck's initial Seed, printed with any failure. ScalaTest runs the tests because it writes JUnit XML reports (-u) and selects tests by name (-z), which lawspec test needs; strategies, cover, targeted search, the failure database, retries, timeouts, order, parallel units and benchmarks stay in the harness around ScalaCheck, as on every JVM target. Decided for 0.24.0.
  opened: 0.24.0
  decided: 0.24.0
  refs: [scalacheck, scala-hedgehog, zio-test, scalatest]

DEC-matcher-facts-in-admission:
  status: decided
  question: Mandatory definition checking lowered every matcher to an opaque sequence, so a refinement such as `v matches regex "[a-z]+"` was never a fact. A value of that refined type, a guard that tested it, or literal text could not fill a field with the same refinement. How does admission keep a matcher's meaning without a solver?
  answer: |
    Source lowering gives each text matcher (starts with, ends with, Text contains, matches regex) the same atom the Core lowering already gives it, named by its built-in and holding its values. The internal checker reads that atom as a propositional variable, never as a number, so a refinement or guard is a fact about the identical test, alone or joined by and, or and not. With literal values the test is decided by the reference semantics every runtime matches (Core.Semantics.helperValue). Membership in a list written out in full is read item by item as equalities, equality with literal text is an atom, a typed scope is an implication from its domain facts, and is within over exact numbers is lowered to the Core elaboration's arithmetic. The precedent is the uninterpreted predicate of first-order logic, as Why3 and SPARK give a pure function or predicate they do not unfold: equal terms give equal truth, nothing more. The checker does not reason about regex languages or text algebra, so `[a-z]+` does not prove `[a-z]*`. Trust boundary: the in-house Fourier-Motzkin checker and propositional reasoning, plus the reference semantics for literal tests; Z3 takes no part in admission (gate 5 decision 3), and admission runs the same in WASM. messageContains is not lowered, because a failure is matched only in laws, never inside a definition. Generated code is unchanged.
  opened: 0.26.0
  decided: 0.26.0
  refs: [why3, spark-ug]

DEC-operation-result-checks:
  status: decided
  question: |
    An ability operation may declare a refined result, such as `reading :: (r :: Int32 where r >= 0)` or `load` at `Store Count`. Handlers owe that refinement only as a tested law, and native handlers are code LawSpec cannot inspect. May a definition that performs the operation rely on the refined result, and on what evidence?
  answer: |
    Yes, after a runtime check at the operation boundary (gate 5 decision 5). After refinement aliases are expanded, each call of an operation with a refined, non-dependent result in a checked definition becomes `let r = op ... in if p r then r else prelude.unreachable m end if` (LawSpec.OperationChecks), where m is Core.operationResultCheck. Every target already runs that conditional and halts on unreachable, so no emitter changes. Mandatory admission reads the checked branch as a typed scope assuming p r, in both the source lowering and the Core lowering, and a let that binds the result keeps the fact for its body. An operation's result is a value of its own: a let names it instead of standing for the opaque call. Evidence lists one runtime-checked obligation per checked operation and definition, with the claim. Ability type arguments are expanded through refinement aliases, so `Store Count` is `Store` at Int32 with the native interface StoreInt32. The precedent is Ada's subtype predicate checks at run time and SPARK's treatment of code outside its proof: a property that is not proved is checked where control returns, and only then assumed. Trust boundary: the generated check and the target's halting on unreachable; the handler's `gives what its type says` law stays a tested law, never an assumption. A dependent result that names an operation argument is not checked yet, so a definition cannot rely on it. The runtime message is the target's generic unreachable message; naming the operation would need each target's emitter.
  opened: 0.26.0
  decided: 0.26.0
  refs: [ada-2022-predicates, spark-ug]

DEC-smtlib-encoding-versions:
  status: decided
  question: The Z3 translation will grow (data types, text, recursion, counterexamples). How do existing solver receipts keep their meaning as it grows?
  answer: |
    lawspec-smtlib-v1 is frozen byte for byte (gate 5 decision 2). A task v1 supports keeps its script, task fingerprint and program fingerprint, so its receipt stays current with no re-run. Any task that needs a new feature is lawspec-smtlib-v2. The compiler tracks the encoding a task needs (Core.Smt `requires`, the newest encoding any feature it uses requires); v1 features never call it, and the task, its script header and its fingerprint name the encoding. A refused task names v1, the encoding that refused it. test/SmtFrozenSpec.hs checks a frozen corpus (test/fixtures/smt-v1: copies of the rc1 examples, Chapter 6, the arithmetic demonstration and the SmtSpec laws, at 32 and 64 bits, through the API's proofTasks method as lawspec prove gets them): every frozen ready task is unchanged, a frozen refused task becomes ready only as v2, and no new v1 task appears. Because the program fingerprint binds the whole checked program, a compiler change that alters a corpus program's Core also fails the test; that is a receipt change and needs its own decision. The precedent is Why3's versioned drivers and session files, which record the prover and transformation a proof used so a replay can tell a changed goal from an unchanged one, and SMT-LIB's own versioned standard. The Node host accepts only v1 until v2 has features and a protocol; increment 4 adds both.
  opened: 0.26.0
  decided: 0.26.0
  refs: [why3, smt-lib, z3]

DEC-validated-counterexamples:
  status: decided
  question: |
    A satisfiable SMT task gives a model of its negation. When may LawSpec report that model as a counterexample of the law, and who checks it?
  answer: |
    Only after the compiler's reference evaluator confirms it (gate 5 increment 4). Each ready task carries a counterexample query, always lawspec-smtlib-v2, next to its unchanged v1 script: it declares the law's outer universal inputs (parameters, inputs and the universal quantifiers that open its body) as constants, asserts their domains and refinements, and asserts that the rest of the law is not established. After a sat answer the Node host runs it and asks get-value for exactly those constants. The host does not parse the values: it sends Z3's answer back through proofTasks (proofCounterexamples), and the compiler re-derives the query from the program, reads the values (LawSpec.Core.Counterexample), checks each against its type and refinements, and evaluates the rest of the law. Inner quantifiers over finite domains within exhaustiveLimit are searched completely, as exhaustively-checked laws are; others leave the result incomplete. The outcomes are refuted (false or undefined at the values), model-not-confirmed (true there, or outside the domain, which is a translation or solver error and is reported as a proof-translation diagnostic) and incomplete. The precedent is Why3's --check-ce and SPARK's counterexample checking, which run the prover's model through runtime assertion checking and show only confirmed ones. Trust boundary: a refutation trusts the reference evaluator, the same as exhaustively-checked, and not Z3; proved still trusts the translation and Z3. A mixed for all/exists law whose inner domain is infinite is not confirmed; a second Z3 query proving no witness exists is later work.
  opened: 0.26.0
  decided: 0.26.0
  refs: [why3, spark-ug, z3]

DEC-smt-datatypes:
  status: decided
  question: |
    How do Z3 tasks reason about LawSpec data (enums, records, alternatives, Maybe, List) without changing v1 tasks or trusting Z3's total selectors?
  answer: |
    Data is a lawspec-smtlib-v2 feature (gate 5 increment 5). Each closed instance a task uses, such as Maybe<Int32>, becomes an SMT-LIB datatype declared with declare-datatypes; its constructors, selectors and testers are quoted symbols that keep LawSpec names (Type#Constructor, Type#Constructor#i). A datum's well-formedness predicate (wf#Type) says each integer field is in its type's range, each nested datum is well formed and each field refinement holds; it is a define-fun, or define-funs-rec when a type is recursive, which is sound because a datum is finite and the predicate recurses structurally. Quantifiers range over well-formed data, construction is defined only when the result is well formed, a match binds a case's fields only under its constructor's tester, and a projection is defined only on the constructor that has the field, so Z3's unspecified selector values on the wrong constructor never decide a law. Equality is SMT structural equality, which is LawSpec's for every admitted type. Refused, as unsupported: handles, indexed families, existential or equation constructors, Rational fields (SMT Real would admit irrational values) and types with no finite value (LawSpec admits empty types; an SMT datatype must be inhabited). Counterexamples over data are read back from Z3's constructor terms and confirmed by the reference evaluator (DEC-validated-counterexamples). The precedent is the SMT-LIB datatypes theory as Why3 uses it for algebraic types, with SPARK's discipline of checking a field's presence against its discriminant instead of trusting the prover's total selectors. Trust boundary: the translation and Z3's datatype theory (decidable for these fragments). List laws that need recursion (length, membership) wait for the recursion encoding of increment 7.
  opened: 0.26.0
  decided: 0.26.0
  refs: [smt-lib, why3, spark-ug, z3]

DEC-refuted-status:
  status: decided
  question: |
    How is a law reported when a confirmed counterexample shows it false?
  answer: |
    As refuted, a status of its own (owner decision after gate 5 increment 5). A refuted law has no supporting evidence: the compiler's exhaustive check found an input where it is false or undefined, or Z3 gave values the reference evaluator confirmed (DEC-validated-counterexamples). The build fails as before: the compiler keeps the law's row with status refuted and adds one refuted diagnostic per failing input, so check, generate and test stop, while lawspec evidence lists the law under REFUTED and exits with status 1; lawspec prove exits with status 1 and sets the row from a confirmed Z3 model. Every other law keeps its status, and a solver receipt keeps its meaning: proved still means unsat under the recorded binding, and a refutation trusts only the evaluator. The API schema stays 5, because refuted is one more value of the documented status vocabulary and no existing value changed meaning; consumers that list statuses (the CLI, the generated TypeScript types and the docs) know it. This amends DEC-evidence-statuses, which reported a false law only as a diagnostic.
  opened: 0.26.0
  decided: 0.26.0

DEC-law-set-analysis:
  status: decided
  question: |
    How are the laws about one function checked together for completeness, overlap, conflict and vacuity, how are checks excused, and what is trusted?
  answer: |
    Owner decision for gate 5 increment 6. Every function with laws has four checks, on by default: completeness (some input satisfies no law's assumptions), overlap (two laws apply to one input), conflict (two applying laws require different results) and vacuity (no input satisfies a law's assumptions). A law joins the set of f when it reads for all ... => [assumptions implies] f arguments = result, with call-free arguments and result; other laws keep only their own evidence. The precedent is SPARK's Contract_Cases (completeness is "at least one case holds", disjointness "at most one holds") and the SPARK/Why3 smoke detector for vacuity. A top-level laws for f are ... end laws block states claims (complete over a condition on f's parameters, without overlap, without conflict) and exemptions (partial, overlap allowed, conflict allowed until V, vacuity allowed for a law), each with because "reason" and an optional until a version or a UTC date-time; conflict needs until. An excused failure is exempted, weaker than assumed, and keeps its counterexample, reason and expiry; past the expiry (compared with package.version or projectVersion, and the request's now) it is refuted with the counterexample and the build fails. Trust boundary: with the exhaustive layer the compiler decides finite domains within exhaustiveLimit with its reference evaluator (exhaustively-checked, or refuted with a confirmed input). Other checks become ground Z3 tasks (lawspec-smtlib-v2) run by the Node host in lawspec prove; every sat model is read back and confirmed by the evaluator before it is reported (an unconfirmed model leaves the check incomplete), and an unsat answer is proved, trusting the translation and Z3 as for laws. Unknown, timeouts and unencodable checks stay incomplete or unsupported. The API schema stays 5: exempted is one more status value and the analysis fields are optional. The exemption's expiry is resolved after the memoised compile, so projectVersion and now do not change the cache key.
  opened: 0.26.0
  decided: 0.26.0
  refs: [spark-ug, why3, z3]

DEC-smt-recursive-definitions:
  status: decided
  question: |
    How do Z3 tasks use recursive checked definitions, and which encoding proves a law when the law says nothing?
  answer: |
    Owner decision 6 for gate 5 (increment 7), with the increments 7-8 syntax: source, CLI and evidence text say prove by unfolding step by step [up to n times], prove by solver recursion, and prove by unfolding step by step, then solver recursion (the default), while the IR and task JSON keep the SMT names guarded-axioms and define-fun-rec. A law that calls a recursive checked definition gets a lawspec-smtlib-v2 task; v1 tasks are unchanged. Only definitions that pass mandatory totality reach Z3, so a non-terminating definition is refused before any task. Two encodings are generated. Guarded axioms with fuel: as Why3's eliminate_recursion, each definition is a declared function with a defining axiom guarded by its argument domains and preconditions, and as in Dafny each call carries fuel (a call in the law starts at 2, the axiom unfolds fuel n+1 into the body at n, fuel 0 is uninterpreted; a call with fuel left equals the fuel-free function, which unfolds once where a hypothesis or cited law names it); patterns trigger both axioms, and the task sets smt.mbqi and auto_config to false as Dafny does, so unfolding is bounded and reproducible. define-fun-rec: SMT-LIB define-funs-rec over the same guarded body, with an unconstrained declared function outside the guard. When nothing is said the host tries both, axioms first; the evidence records the encoding that proved the law and every attempt. Trust boundary: the translation, Z3, and two facts taken from mandatory admission rather than re-derived: on its domain a recursive definition is defined, and its result lies in its result type (admission proved both by induction over calls it proved terminate). A call is defined when its arguments are in the domain and the callee's runtime postconditions hold. A model from a recursive task may rest on unfolding that stopped at its fuel; the evaluator checks it, and an unconfirmed one leaves the law incomplete rather than reporting a translation error. A law's harness may choose one encoding or the fuel (LawSpec.ProofSettings).
  opened: 0.26.0
  decided: 0.26.0
  refs: [why3, z3, spark-ug]

DEC-smt-induction:
  status: decided
  question: |
    How does lawspec prove prove a law by induction, how are lemmas cited, and how are induction failures reported?
  answer: |
    Owner decisions 7 and the increments 7-8 syntax (gate 5 increment 8). A law's harness says prove by induction on x [using "|a|, "|b|], or prove without induction; when nothing is said, a law over recursive definitions with exactly one input of a recursive data type gets one induction try on it. The schema follows Why3's induction_ty_lex and induction_int_lex on the named input: one case per constructor of x's data type, with the law assumed for each field of x's type, or, for an integer type with a lower bound, the bound and then n from n - 1. (The termination checker's structural and countdown descent are exactly these schemas for the definitions it admits; a per-branch functional induction schema in the style of Lean's f.induct is not generated.) In each case the law's inputs are constants named as in its counterexample query, the hypothesis is the law at the smaller value both at the case's other inputs and for all of them, and each cited law is assumed; each case is its own lawspec-smtlib-v2 task with its own fingerprint and receipt, tried in the law's encodings in turn. The law is proved only when every case is unsat; any other case outcome leaves it incomplete, naming the case. A satisfiable case's model is checked by the reference evaluator as the law's counterexample: refuted if the law fails there, otherwise the induction hypothesis is too weak (Why3's SW) and the law stays incomplete. Cited laws must be laws of the same unit (the harness's scope), not the law itself, and citations may not form a cycle; a citing law's proof rests on each cited law's current evidence, so while a cited law is not proved or exhaustively checked the citing law is incomplete. Assumed quantified laws are one prenex quantifier over all their inputs with explicit triggers: the outermost call to a recursive definition naming every input, so they rewrite left to right without matching loops. Trust boundary: the translation and Z3, as for other proofs, plus the schema generator in LawSpec.Core.Smt.
  opened: 0.26.0
  decided: 0.26.0
  refs: [why3, z3]

DEC-smt-text:
  status: decided
  question: |
    How do Z3 tasks reason about Text, the matchers and regexes, given that Z3 models code points only up to U+2FFFF?
  answer: |
    Owner decision 11 (gate 5 increment 9), corrected during integration without restricting LawSpec's Text domain; the owner accepted this full-Unicode encoding in place of decision 11's refusal above U+2FFFF at the gate 5 sign-off (22 October 2026). Z3's U+2FFFF native alphabet cannot represent all Unicode scalars: a negated class covering that alphabet supplies a concrete false-proof control. Text is therefore serialized as standard UTF-32BE bytes in SMT strings (Unicode 17, D99). Its domain is the regular language of valid scalar words, excluding surrogates; every scalar through U+10FFFF is preserved. Length and slice use four-byte scalar boundaries; concat and ordering preserve the representation; contains quantifies a matching slice at a byte offset divisible by four. Integer rendering is encoded after decimal conversion. Regex classes are lexicographic intervals of four-byte words using Z3's existing regex operators; complements use all valid scalar words. Counterexamples decode and validate UTF-32BE before evaluator replay. Differential tests cover scalar/byte boundaries and supplementary planes. The compiler generates obligations; the Node host executes Z3; no kernel-checked certificate is claimed. The translation, UTF-32BE conversion and Z3 remain trusted; unknown remains incomplete. List length and append keep their existing recursive datatype encoding.

  opened: 0.26.0
  decided: 0.26.0
  refs: [z3, smt-lib, unicode-utf32]

DEC-smt-numbers:
  status: decided
  question: |
    How do Z3 tasks quantify Rational and Decimal inputs and reason about IEEE floats without changing a law's meaning?
  answer: |
    Owner decision 1 (everything in 1.0; gate 5 increment 13). A Rational input is quantified as an integer over a positive integer, in both polarities and in assumed laws, so no witness is irrational (proposal 2.1; a Real quantifier could choose a square root of two). A Decimal is an exact Real: a universal over all Reals is sound because they include every decimal, a witness (an existential, or a counterexample query's input) is an integer times 10^-18 and so is a decimal, and a law proved for all Reals is assumed for all Reals, matching how it was proved. Rational to Decimal conversion is unsupported. Float32 and Float64 are SMT-LIB FloatingPoint (8 24) and (11 53) with RNE, as LawSpec computes; equality and comparisons are IEEE's (fp.eq, so NaN differs from itself and the zeros are equal), and the classification helpers map to fp.isNaN, fp.isInfinite and the zero and sign tests. A data type holding a float is refused, since SMT equality on data is structural and LawSpec's is not. All are lawspec-smtlib-v2; v1 tasks are unchanged. Z3's values are read back exactly (rationals, terminating decimals, and float bits from fp literals or specials) and confirmed by the evaluator. Precedent: SPARK's floating-point translation through Why3 to SMT FloatingPoint, and Why3's exact real arithmetic. Trust boundary: the translation and Z3's arithmetic and floating-point theories.
  opened: 0.26.0
  decided: 0.26.0
  refs: [why3, spark-ug, z3, ieee-754]

DEC-model-checking:
  status: decided
  question: |
    How are claims about a stateful model's runs checked, with fairness, and how are they kept apart from native conformance?
  answer: |
    Owner decision 12 and the temporal syntax (gate 5 increment 10). A property is written in plain words (always, eventually, whenever P, Q, never P before Q, until, implies, and, or, not; parameters between its words), and a law says law n in model m [assuming [strong] fairness for c, ...] is definition: every run holds P | some run holds P. Atoms are Bool functions of the model state. The law is checked over the model's reference only: its start definition, each command's reference definition and precondition, and its typestate indices, computed by the reference evaluator with each command's arguments drawn from their finite types; it never runs the native implementation, whose model conformance keeps its own rows. The in-house checker (LawSpec.Core.ModelCheck), shared by the native and WASM compilers, translates the formula (negated for every run) to a generalized Büchi automaton by the Gerth-Peled-Vardi-Wolper tableau, explores the product breadth first, and searches its strongly connected components (Tarjan) for an accepting fair cycle; weak fairness rejects a component where a command stays enabled and is never taken, and strong fairness refines a component by removing states where an untaken command is enabled (Lichtenstein and Pnueli). A run that ends stays in its last state. Results: proved when the complete search finds no counterexample (every run) or finds a run (some run), naming how many states were explored; refuted with the run as its commands, the repeating steps in parentheses; incomplete when the search stops at its bound (20000 states), saying no counterexample was found up to there; unsupported when a step cannot be evaluated or a deadline needs time. Temporal laws live beside the Core program, so existing program fingerprints and v1 receipts are unchanged. Trust boundary: the reference evaluator, the tableau and the search.
  opened: 0.26.0
  decided: 0.26.0
  refs: [gpvw-ltl, lichtenstein-pnueli-fairness]

DEC-model-induction:
  status: decided
  question: |
    How are model laws decided when the explicit search cannot finish, and how do deadlines use time?
  answer: |
    Owner decisions 9, 10 and 12 (gate 5 increment 11). For a law every run holds always P over a model the explicit search leaves open (an unbounded state, or arguments without a finite domain), lawspec prove gets lawspec-smtlib-v2 tasks over the model's reference: induction (P holds of every first state, and each command keeps it under its precondition), each its own task; Spacer (SMT-LIB HORN, an invariant Inv over the state, or over a record state's fields, which Spacer handles far better than a datatype), used only as an untrusted generator, whose proposed Inv the compiler validates as one define-fun and re-checks with plain queries (Inv holds at the start, every command keeps it, Inv implies P); and a bounded run search of up to 8 steps for a state where P fails, whose run the reference evaluator replays before the law is refuted. The host repeats rounds while the compiler asks for new tasks (Spacer's re-checks). Deadlines (whenever P, Q within d, and Q within d) use discrete time in whole microseconds: commands take no time, and time passes in ticks of the greatest common divisor of d and one hour, only through the model's explicit wait command (its precondition is the clock model); a model without wait cannot check a deadline; a deadline met at exactly d is met, and a run that misses it is refuted and shown with the time waited. The explicit search's bound is 20000 states. Trust boundary: induction and invariant proofs trust the typed translation and Z3; Spacer is trusted for nothing; refutations trust the reference evaluator's replay.
  opened: 0.26.0
  decided: 0.26.0
  refs: [z3, gpvw-ltl]

DEC-history-checking:
  status: decided
  question: |
    How are laws about an observed history checked, keeping an invariant, a bounded history property and an unbounded future requirement apart?
  answer: |
    Gate 5 increment 12 (portfolio 13.5). A law in history h judges the entries a checked definition taking Unit gives, in order, with atoms that are predicates of one entry. The complete history holds P treats the history as closed (the run stays at its last entry), so the law is proved or refuted. The history so far holds P is three-valued, as LTL3 is (Bauer, Leucker and Schallhart): the compiler reads the prefix through the generalized Büchi automata of P and of not P (the increment 10 tableau) and asks whether any continuation can still satisfy each; proved when no continuation breaks P, refuted at the first entry after which none keeps it, and pending otherwise, with a new evidence status, pending, that is neither evidence nor failure (its reason says whether P holds so far). A deadline (whenever P, Q within d) reads each entry's time from its field at and is refuted as soon as an entry is observed past the deadline with no Q before it. An invariant is a model law (every run), a bounded history property is judged over a complete history, and an unbounded future requirement stays pending while the history is open. The API schema stays 5: pending is one more status value. Trust boundary: the reference evaluator and the automata.
  opened: 0.26.0
  decided: 0.26.0
  refs: [gpvw-ltl, bauer-leucker-schallhart-ltl3]

DEC-gate-5-receipt:
  status: decided
  question: |
    What does gate 5 deliver, and what does it leave explicit?
  answer: |
    The gate 5 receipt in LAWSPEC-PRE-1.0-REVIEW.md (Gate 5 proof work, 22 October 2026) records the supported fragments, their trust boundaries, the retained portfolio items 13.1, 13.3 to 13.8 and 14.10 with their fixtures and tests, the limits kept explicit, and the owner-confirmed syntax: history laws say the complete history holds P or the history so far holds P, and model time advances only through an explicit wait command, in ticks of the greatest common divisor of the deadline and one hour. A deadline without that command is unsupported. Mandatory admission stays Fourier-Motzkin only; v1 receipts are frozen; new work is lawspec-smtlib-v2; there is no kernel-checked tier (owner decision 4). The owner signed off gate 5 on 22 October 2026, accepting these fragments, trust boundaries, limits and portfolio results, and accepting the full-Unicode Text encoding (DEC-smt-text) in place of the refusal above U+2FFFF.
  opened: 0.26.0
  decided: 0.26.0
  refs: [why3, spark-ug, z3]

DEC-source-format-modes-and-layout:
  status: decided
  question: How should source formatting admit drafts and lay out record types?
  answer: |
    lawspec fmt parses all input and formatted output through the authoritative grammar without compiling by default. It does not require package resolution, check definitions or produce verification evidence. Available packages supply parser headers, with existing version selection and original source coordinates when resolution succeeds; missing package directories do not block parsing. --compile opts into the existing compiler checks before and after formatting, preserving mandatory definition validation independently of optional law verification. --check is available in either mode; syntax or requested compile errors prevent all writes. SDK format and editor formatting keep their checked default for compatibility; compile false selects syntax-only SDK formatting. Reuse the parser's inventory rather than maintaining a second grammar or scraping generated source.

    Use Haskell-like two-space block and continuation indentation, with an 80-column target. Record types have separate opening and closing brace lines and one field per line, two spaces inside each pair of braces, including short and nested records. Existing supported annotation wording and literal/comment contents are preserved; optional record-type commas are removed. Record values, patterns and tuples retain their separators. This records the owner's 2026-10-22 direction; three-space alignment may be used when required by an existing syntactic construct, rather than imposing a uniform three-space block indent.
  opened: 0.29.0
  decided: 0.29.0

DEC-parser-error-recovery:
  status: decided
  question: How should parsing report independent failures without accepting a partial specification?
  answer: |
    Use Megaparsec withRecovery and registerParseError, following its documented delayed-error and StateT rollback semantics. Run the original authoritative grammar first. Only after failure, rerun that grammar with recovery at values, types, fields, rows, law sections, declarations and harness items. Temporary scalar/type/expression terms exist only in that diagnostic pass. Its result can never reach elaboration, source formatting or evidence, even if a recovery pass succeeds. The original failure is always retained. Valid-source parsing and mandatory definition validation retain their admission rules independently of optional law verification.

    Collect independent parse failures across supplied sources for fmt and checked compiler requests. Preserve original coordinates, including package namespace insertions; keep opener links for block errors. Use the existing lossless lexer and block catalogue to synchronize without treating comments, quoted text, inner commas or named closers as sibling declarations. Suppress induced unclosed outer blocks rather than presenting them as new independent failures. Corrupt quotation or block structure can make later syntax unrecoverable; this is diagnostic recovery, not an exhaustive analysis or a migration tool. No source is written if parsing fails anywhere in a formatting request.
  opened: 0.29.1
  decided: 0.29.1
  refs: [megaparsec-error-recovery]
