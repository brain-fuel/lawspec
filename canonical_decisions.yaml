DEC-lawspec-quantifier-layout:
  status: decided
  question: How should source formatting make quantified claims readable?
  answer: |
    Owner feedback rejects a seats property whose header and body share a line while multiplication and the closing clause spill onto the next. Format quantified headers, indented claims and matching closers as separate structural lines using the authoritative parser inventory. Rejoin short arithmetic claims within their own width; break long headers between complete binders and align the separator with the opening keyword. Apply the same rule to universal, existential and given scopes, including nested claims. Preserve comments, literal contents, source tokens and definition semantics; repeated formatting must be stable. Regenerate supplied lesson projects with the actual compiler and rebuild the browser WASM formatter so formatting before Run produces the same layout. Keep current progress identities and learner edits, including kept regression cases. This is a formatting correction, not teaching-review approval or new verification evidence.
