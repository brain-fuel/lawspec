DEC-learn-novice-results:
  status: decided
  question: How should a learner new to property-based testing read the course and recover from experiments?
  answer: |
    Owner direction requests a whole-experience novice review. Introduce examples, properties, generators, counterexamples, shrinking and regressions before first use. Show English claim labels from compiler metadata, keep native check identities and errors available in diagnostics, and distinguish actual named properties from generated trial counts and accepted shrinking steps. Observe concrete implementation calls without replacing generated assertions. Keep the failing input visible and put the actual trace and coverage counts behind explanatory disclosures. Expected teaching failures remain failed checks, with qualified guidance only when the supplied project ran as authored. Preserve explicit errors, unsupported and incomplete results and mandatory admission. Offer one immediate Undo reset / solution for source replacement in the open step; discard it on manual editing or navigation and require rerun for execution evidence. Keep the existing font/theme/navigation and consistent Run checks action. This is a refinement of the six-lesson teaching preview, not teaching approval or expansion beyond its checkpoint.
