DEC-learn-english-names:
  status: decided
  question: When should tutorial code use English phrase names rather than camel case?
  answer: |
    Owner direction prefers readable English names wherever they clarify purpose, using the existing phrase syntax rather than arbitrarily compressing claims into camel case. Use sentence labels for learner-facing laws and phrase names for descriptive checked helpers; retain concise implementation, input and strategy names where they help call sites. Teach the real delimiter grammar and matching references, and verify native identifier generation through the authoritative compiler. The current strategy declaration grammar requires lowercase bare names; use lists and numbers without adding grammar aliases. Adjust Monaco phrase auto-closing so it does not add an invalid trailing quote. Keep the current course version and prior draft identities. Refresh starter Laws/Harness files together only when both still equal their archived supplied versions; preserve user implementations, edits, milestones and kept regression cases. Previous source snapshots support compatibility, not a second active curriculum. Preserve parser validation, actual execution/replay and the separately recorded browser binding limitations.
