name: LawSpec
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          enable-stack: true
          stack-version: latest
      - run: node tools/build-integrity.mjs
      - run: stack --no-terminal test
      - run: node tools/parity.mjs
      - run: node tools/package-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lawspec-npm
          path: .artifacts/*.tgz
  runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test npm/test/*.test.mjs
  targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: java
          - target: kotlin
          - target: python
            python: '3.13'
          - target: python
            python: '3.14'
          - target: javascript
          - target: typescript
          - target: go
          - target: haskell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        if: matrix.target == 'java' || matrix.target == 'kotlin'
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.target == 'kotlin'
        with:
          gradle-version: '9.3.0'
      - uses: astral-sh/setup-uv@v6
        if: matrix.target == 'python'
      - uses: actions/setup-go@v5
        if: matrix.target == 'go'
        with:
          go-version: '1.22.x'
          cache: false
      - uses: haskell-actions/setup@v2
        if: matrix.target == 'haskell'
        with:
          ghc-version: '9.10.3'
          enable-stack: true
          stack-version: latest
      - run: node tools/bootstrap-integration.mjs ${{ matrix.target }}
        env:
          LAWSPEC_PYTHON: ${{ matrix.python }}
      - run: node tools/integration.mjs ${{ matrix.target }}
