name: LawSpec
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          enable-stack: true
          stack-version: latest
      - run: node tools/build-integrity.mjs
      - run: node tools/check-boundaries.mjs
      - run: stack --no-terminal test
      - run: node tools/parity.mjs
      - run: node tools/package-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lawspec-npm
          path: .artifacts/*.tgz
  runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test npm/test/*.test.mjs
  targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: java
          - target: kotlin
          - target: python
            python: '3.13'
          - target: python
            python: '3.14'
          - target: javascript
          - target: typescript
          - target: go
          - target: haskell
          - target: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        if: matrix.target == 'java' || matrix.target == 'kotlin'
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.target == 'kotlin'
        with:
          gradle-version: '9.3.0'
      - uses: astral-sh/setup-uv@v6
        if: matrix.target == 'python'
      - uses: actions/setup-go@v5
        if: matrix.target == 'go'
        with:
          go-version: '1.22.x'
          cache: false
      - uses: haskell-actions/setup@v2
        if: matrix.target == 'haskell'
        with:
          ghc-version: '9.10.3'
          enable-stack: true
          stack-version: latest
      - run: node tools/bootstrap-integration.mjs ${{ matrix.target }}
        env:
          LAWSPEC_PYTHON: ${{ matrix.python }}
      - run: node tools/integration.mjs ${{ matrix.target }}
      - run: node tools/rust-layout-integration.mjs
        if: matrix.target == 'rust'
      - run: node tools/algebra-integration.mjs ${{ matrix.target }}
        env:
          LAWSPEC_MUTANTS: '1'

      - run: node tools/scalar-integration.mjs ${{ matrix.target }}
        env:
          LAWSPEC_MUTANTS: '1'
      - run: node tools/scalar-integration.mjs ${{ matrix.target }}
        env:
          LAWSPEC_MACHINE_BITS: '32'

      - run: node tools/refinement-integration.mjs ${{ matrix.target }}
        env:
          LAWSPEC_MUTANTS: '1'
      - run: node tools/refinement-integration.mjs ${{ matrix.target }}
        env:
          LAWSPEC_MACHINE_BITS: '32'

  rust:
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.85.0', 'stable']
        mode: ['debug', 'release']
        target: [x86_64-unknown-linux-gnu, i686-unknown-linux-gnu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
        if: matrix.target == 'i686-unknown-linux-gnu'
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --target ${{ matrix.target }}
      - run: cargo test --manifest-path runtime/rust/Cargo.toml --locked ${{ matrix.mode == 'release' && '--release' || '' }}
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}
      - run: node tools/scalar-integration.mjs rust
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          LAWSPEC_MACHINE_BITS: ${{ matrix.target == 'i686-unknown-linux-gnu' && '32' || '64' }}
          LAWSPEC_RUST_RELEASE: ${{ matrix.mode == 'release' && '1' || '0' }}
          LAWSPEC_MUTANTS: '1'
      - run: node tools/scalar-integration.mjs rust
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          LAWSPEC_MACHINE_BITS: ${{ matrix.target == 'i686-unknown-linux-gnu' && '64' || '32' }}
          LAWSPEC_RUST_RELEASE: ${{ matrix.mode == 'release' && '1' || '0' }}
      - run: node tools/refinement-integration.mjs rust
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          LAWSPEC_MACHINE_BITS: ${{ matrix.target == 'i686-unknown-linux-gnu' && '32' || '64' }}
          LAWSPEC_RUST_RELEASE: ${{ matrix.mode == 'release' && '1' || '0' }}
          LAWSPEC_MUTANTS: '1'
      - run: node tools/algebra-integration.mjs rust
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          LAWSPEC_RUST_RELEASE: ${{ matrix.mode == 'release' && '1' || '0' }}
          LAWSPEC_MUTANTS: '1'
