version: 0.20.0
registry: canonical_refs.yaml
decisions: canonical_decisions.yaml
exemptions: canonical_exemptions.yaml
vetting: canonical_vetting
ignore:
  - .canon/
  - .integration/
  - .tools/
  - .artifacts/
  - example_artifacts/
  - "*.md"
  - "!docs/**/*.md"
  - docs/index.md
  - templates/site/playground.mjs
  - templates/tools/package-smoke.mjs
  - npm/
  - tools/*.mjs
  - editors/vscode/test/grammar.test.mjs
  - src/LawSpec/RuntimeSources.hs
languages:
  folio:
    extensions: [.md]
    lexer: .canon/grammars/folio/FolioLexer.g4
    parser: .canon/grammars/folio/FolioParser.g4
    start: document
  make:
    extensions: [Makefile]
    lexer: .canon/grammars/make/canonically_commented/MakefileLexer.g4
    parser: .canon/grammars/make/canonically_commented/MakefileParser.g4
    start: makefile
  haskell:
    extensions: [.hs]
    lexer: .canon/grammars/haskell/canonically_commented/HaskellLexer.g4
    parser: .canon/grammars/haskell/canonically_commented/HaskellParser.g4
    start: module
  java:
    extensions: [.java]
    lexer: .canon/grammars/java/canonically_commented/JavaLexer.g4
    parser: .canon/grammars/java/canonically_commented/JavaParser.g4
    start: compilationUnit
  python:
    extensions: [.py]
    lexer: .canon/grammars/python/canonically_commented/Python3Lexer.g4
    parser: .canon/grammars/python/canonically_commented/Python3Parser.g4
    start: file_input
  javascript:
    extensions: [.js, .mjs, .cjs]
    lexer: .canon/grammars/javascript/canonically_commented/JavaScriptLexer.g4
    parser: .canon/grammars/javascript/canonically_commented/JavaScriptParser.g4
    start: program
  typescript:
    extensions: [.ts, .mts, .cts]
    lexer: .canon/grammars/typescript/canonically_commented/TypeScriptLexer.g4
    parser: .canon/grammars/typescript/canonically_commented/TypeScriptParser.g4
    start: program
  go:
    extensions: [.go]
    lexer: .canon/grammars/golang/canonically_commented/GoLexer.g4
    parser: .canon/grammars/golang/canonically_commented/GoParser.g4
    start: sourceFile
  kotlin:
    extensions: [.kt, .kts]
    lexer: .canon/grammars/kotlin/canonically_commented/KotlinLexer.g4
    parser: .canon/grammars/kotlin/canonically_commented/KotlinParser.g4
    start: kotlinFile
  rust:
    extensions: [.rs]
    lexer: .canon/grammars/rust/RustLexer.g4
    parser: .canon/grammars/rust/RustParser.g4
    start: crate
    comments:
      line: "//"
      blockOpen: "/*"
      blockClose: "*/"
      outerDoc: ["///", "/**"]
      innerDoc: ["//!", "/*!"]
      strings: ["\""]
    units:
      - {rule: function_, kind: function, name: {rule: identifier}, required: false}
      - {rule: structStruct, kind: struct, name: {rule: identifier}, required: false}
      - {rule: tupleStruct, kind: struct, name: {rule: identifier}, required: false}
      - {rule: enumeration, kind: enum, name: {rule: identifier}, required: false}
      - {rule: union_, kind: union, name: {rule: identifier}, required: false}
      - {rule: trait_, kind: trait, name: {rule: identifier}, required: false}
      - {rule: macroRulesDefinition, kind: macro, name: {rule: identifier}, required: false}
      - {rule: typeAlias, kind: type, name: {rule: identifier}, required: false}
      - {rule: constantItem, kind: const, name: {rule: identifier}, required: false}
      - {rule: staticItem, kind: static, name: {rule: identifier}, required: false}
      - {rule: inherentImpl, kind: impl, name: {rule: type_}, required: false}
      - {rule: traitImpl, kind: impl, name: {rule: traitImplTarget}, required: false}
      - {rule: module, kind: module, name: {rule: identifier}, required: false}
      - {rule: enumItem, kind: variant, name: {rule: identifier}, required: false}
      - {rule: structField, kind: field, name: {rule: identifier}, required: false}
      - {rule: tupleField, kind: field, name: {ordinal: true}, required: false}
