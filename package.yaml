name: lawspec
version: 0.31.0
license: MIT
synopsis: Portable executable laws
extra-source-files: [vendor/unicode/LICENSE.txt, vendor/unicode/NORMALIZATION-LICENSES.txt, vendor/unicode/17.0.0/CaseFolding.txt, vendor/unicode/17.0.0/EastAsianWidth.txt, vendor/unicode/17.0.0/DerivedGeneralCategory.txt, vendor/unicode/17.0.0/DerivedAge.txt, README.md, CHANGELOG.md, test/FiniteCases.java, test/finite_cases_jvm.py, test/finite_cases_go.py, test/finite_cases_haskell.hs, test/finite_cases.swift, test/finite_cases_testing.swift, test/finite_cases_swift.py, test/finite_cases_test.go, test/embed_literals.hs, test/finite-cases.mjs, test/finite_cases.py, runtime/*.rs, runtime/*.mjs, runtime/*.py, runtime/*.pl, test/prolog_runtime.py, test/prolog_reporting.py, test/fixtures/prolog/*.pl, test/fixtures/prolog/*.lawspec, runtime/*.hs, runtime/*.java, runtime/*.inc, runtime/*.kt, runtime/*.go, runtime/*.erl, runtime/*.c, runtime/*.escript, runtime/*.ex, runtime/*.gleam, runtime/defaults/vectors.txt, runtime/defaults/*/*, runtime/rust/Cargo.toml, runtime/rust/Cargo.lock, examples/specs/*.lawspec, examples/rc1-authoring.lawspec, examples/rc1/*.lawspec, examples/rc1/nesting/*.lawspec, test/fixtures/blake3-256.json, test/fixtures/*.lawspec, test/fixtures/blake3sum.json, test/fixtures/smt-corpus/*.lawspec, test/fixtures/recorded-values.json, test/fixtures/recorded-web.mjs, test/fixtures/recorded_python.py, test/fixtures/beam/*.erl, test/fixtures/native-payments/*.rs, test/fixtures/native-payments/*.py, test/fixtures/native-payments/*.ts, test/fixtures/native-payments/*.java, test/fixtures/native-payments/*.kt, test/fixtures/native-payments/*.hs, test/fixtures/native-payments/*.go, test/fixtures/native-payments/*.json, test/fixtures/native-shapes/*.rs, test/fixtures/native-shapes/*.java, test/fixtures/native-shapes/*.kt, test/fixtures/native-shapes/*.hs, test/fixtures/native-shapes/*.go, test/fixtures/native-shapes/*.json, test/fixtures/native-go-names/*.go, test/fixtures/native-go-names/*.json, test/fixtures/native-go-names/*.lawspec, test/fixtures/native-go-codecs/*.go, test/fixtures/native-go-codecs/*.json, test/fixtures/native-go-external/*.go, test/fixtures/native-go-external/*.json, test/fixtures/native-go-external/*.lawspec, test/fixtures/native-codecs/*.rs, test/fixtures/native-codecs/*.hs, test/fixtures/native-codecs/*.py, test/fixtures/native-codecs/*.ts, test/fixtures/native-codecs/*.java, test/fixtures/native-codecs/*.kt, test/fixtures/native-codecs/*.go, test/fixtures/native-codecs/*.json, test/fixtures/native-codecs/*.lawspec, test/FiniteCases.fs, test/finite_cases_dotnet.py, test/scala_no_arg_constructors.py, runtime/dotnet/*/*.fs, runtime/dotnet/*/*.fsproj]
dependencies: [base >= 4.18 && < 5, text, containers, aeson, bytestring, directory, filepath, megaparsec, parser-combinators, mtl]
default-extensions: [OverloadedStrings, DeriveGeneric, LambdaCase, RecordWildCards]
ghc-options: [-Wall]
library:
  source-dirs: src
  dependencies: [transformers, array, binary, unicode-data == 0.6.0, unicode-transforms == 0.4.0.1]
executables:
  lawspec-core:
    main: Main.hs
    source-dirs: app
    dependencies: [lawspec]
  lawspec-dev:
    main: Main.hs
    source-dirs: [dev, dev/scheduler]
    dependencies: [lawspec, cryptohash-sha256, process, time, commonmark, commonmark-extensions, vector, unix]
    # The threaded runtime counts the processors (for ci --jobs) and lets a
    # step wait for its process without stopping the others.
    ghc-options: [-threaded]
  lawspec-acceptance:
    main: Main.hs
    source-dirs: acceptance
    dependencies: [lawspec, process, vector, cryptohash-sha256, text, time]
tests:
  lawspec-test:
    main: Main.hs
    source-dirs: [test, dev/scheduler]
    dependencies: [lawspec, hspec, vector, process, binary]
