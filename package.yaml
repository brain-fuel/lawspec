name: lawspec
version: 0.21.0
license: MIT
synopsis: Portable executable laws
extra-source-files: [README.md, CHANGELOG.md, runtime/*.rs, runtime/*.mjs, runtime/*.py, runtime/*.hs, runtime/*.java, runtime/*.kt, runtime/*.go, runtime/defaults/vectors.txt, runtime/defaults/*/*, runtime/rust/Cargo.toml, runtime/rust/Cargo.lock, examples/specs/*.lawspec, test/fixtures/*.lawspec, test/fixtures/native-payments/*.rs, test/fixtures/native-payments/*.py, test/fixtures/native-payments/*.ts, test/fixtures/native-payments/*.java, test/fixtures/native-payments/*.kt, test/fixtures/native-payments/*.hs, test/fixtures/native-payments/*.go, test/fixtures/native-payments/*.json, test/fixtures/native-shapes/*.rs, test/fixtures/native-shapes/*.java, test/fixtures/native-shapes/*.kt, test/fixtures/native-shapes/*.hs, test/fixtures/native-shapes/*.go, test/fixtures/native-shapes/*.json, test/fixtures/native-go-names/*.go, test/fixtures/native-go-names/*.json, test/fixtures/native-go-names/*.lawspec, test/fixtures/native-go-codecs/*.go, test/fixtures/native-go-codecs/*.json, test/fixtures/native-go-external/*.go, test/fixtures/native-go-external/*.json, test/fixtures/native-go-external/*.lawspec, test/fixtures/native-codecs/*.rs, test/fixtures/native-codecs/*.hs, test/fixtures/native-codecs/*.py, test/fixtures/native-codecs/*.ts, test/fixtures/native-codecs/*.java, test/fixtures/native-codecs/*.kt, test/fixtures/native-codecs/*.go, test/fixtures/native-codecs/*.json, test/fixtures/native-codecs/*.lawspec]
dependencies: [base >= 4.18 && < 5, text, containers, aeson, bytestring, directory, filepath, megaparsec, parser-combinators, mtl]
default-extensions: [OverloadedStrings, DeriveGeneric, LambdaCase, RecordWildCards]
ghc-options: [-Wall]
library:
  source-dirs: src
  dependencies: [transformers, array, binary]
executables:
  lawspec-core:
    main: Main.hs
    source-dirs: app
    dependencies: [lawspec]
  lawspec-dev:
    main: Main.hs
    source-dirs: dev
    dependencies: [lawspec, cryptohash-sha256, process, time, commonmark, commonmark-extensions, vector]
  lawspec-acceptance:
    main: Main.hs
    source-dirs: acceptance
    dependencies: [lawspec, process, vector, cryptohash-sha256, text]
tests:
  lawspec-test:
    main: Main.hs
    source-dirs: test
    dependencies: [lawspec, hspec, vector, process]
