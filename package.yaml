name: lawspec
version: 0.9.0
license: MIT
synopsis: Portable executable laws
extra-source-files: [README.md, PRIMITIVES.md, REFINEMENTS.md, RUST.md, JAVA.md, PYTHON.md, GO.md, HASKELL.md, KOTLIN.md, WEB.md, LANGUAGE.md, API-MIGRATION.md, RELEASE-0.9.md, runtime/*.rs, runtime/*.mjs, runtime/*.py, runtime/*.hs, runtime/*.java, runtime/*.kt, runtime/*.go, runtime/rust/Cargo.toml, runtime/rust/Cargo.lock, examples/specs/*.lawspec, test/fixtures/*.lawspec]
dependencies: [base >= 4.18 && < 5, text, containers, aeson, bytestring, directory, filepath, megaparsec, parser-combinators, mtl]
default-extensions: [OverloadedStrings, DeriveGeneric, LambdaCase, RecordWildCards]
ghc-options: [-Wall]
library:
  source-dirs: src
  dependencies: [transformers]
executables:
  lawspec-core:
    main: Main.hs
    source-dirs: app
    dependencies: [lawspec]
tests:
  lawspec-test:
    main: Main.hs
    source-dirs: test
    dependencies: [lawspec, hspec]
